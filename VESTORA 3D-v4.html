<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VESTORA 3D — فروشگاه سه‌بعدی پوشاک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5; --surface:#ffffff; --ink:#171614; --ink-soft:#6b655c;
    --line:#e9e4dc; --accent:#8a6d3b; --accent-soft:#c9a96a; --gold:#c9a96a; --gold-deep:#a8874e;
    --danger:#b23b3b; --ok:#2f7d4f; --warn:#c07a2a;
    --radius:16px; --radius-sm:10px;
    --shadow:0 4px 18px rgba(20,20,20,.05); --shadow-lg:0 20px 50px rgba(20,20,20,.13);
    --header-h:66px; --bottom-h:64px;
    --font:"Vazirmatn",system-ui,sans-serif;
    --glass:rgba(255,255,255,.72);
  }
  [data-theme="dark"]{
    --bg:#0f0f0f; --surface:#1a1a1a; --ink:#f3efe8; --ink-soft:#a09a90;
    --line:#2b2b2b; --glass:rgba(30,30,30,.72);
    --shadow:0 4px 18px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    line-height:1.75;overflow-x:hidden;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  input,select,textarea{font-family:inherit;font-size:1rem}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
  .container{width:min(1280px,100% - 32px);margin-inline:auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 26px;border-radius:999px;font-weight:600;font-size:.92rem;
    transition:transform .18s ease,background .2s ease,box-shadow .2s ease,border-color .2s;
    border:1.5px solid transparent;white-space:nowrap;line-height:1.2;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--ink);color:var(--bg)}
  .btn-primary:hover{background:var(--accent)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;box-shadow:0 4px 14px rgba(138,109,59,.3)}
  .btn-gold:hover{box-shadow:0 10px 26px rgba(138,109,59,.4);transform:translateY(-1px)}
  .btn-outline{border-color:var(--line);background:var(--surface)}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:rgba(178,59,59,.1);color:var(--danger)}
  .btn-danger:hover{background:var(--danger);color:#fff}
  .btn-sm{padding:8px 16px;font-size:.82rem}
  .btn-xs{padding:5px 12px;font-size:.75rem}
  .btn-block{width:100%}
  .icon-btn{
    width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    transition:background .2s,transform .2s;position:relative;color:var(--ink);
  }
  .icon-btn:hover{background:var(--line)}
  .badge{
    position:absolute;top:2px;left:2px;min-width:18px;height:18px;padding:0 5px;
    border-radius:9px;background:var(--accent);color:#fff;font-size:.66rem;
    display:grid;place-items:center;font-weight:700;
  }
  .badge:empty,.badge[data-count="0"]{display:none}

  .header{
    position:sticky;top:0;z-index:60;background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);height:var(--header-h);display:flex;align-items:center;
  }
  .header-inner{display:flex;align-items:center;gap:14px;width:min(1280px,100% - 24px);margin-inline:auto}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;letter-spacing:.4px;flex-shrink:0}
  .logo-mark{
    width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ink),var(--accent));
    color:#fff;display:grid;place-items:center;font-size:1.05rem;font-weight:800;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
  }
  .logo small{display:block;font-size:.56rem;font-weight:500;color:var(--accent);letter-spacing:3px;line-height:1}
  .nav-desktop{display:none;gap:2px;margin-inline-start:12px}
  .nav-desktop button{
    padding:8px 15px;border-radius:999px;font-size:.88rem;font-weight:500;
    color:var(--ink-soft);transition:.2s;
  }
  .nav-desktop button:hover,.nav-desktop button.active{color:var(--ink);background:var(--line)}
  .header-actions{margin-inline-start:auto;display:flex;align-items:center;gap:1px}
  .search-wrap{position:relative;display:none}
  .search-wrap input{
    width:210px;padding:9px 40px 9px 14px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--surface);font-size:.85rem;transition:.25s;
  }
  .search-wrap input:focus{outline:none;border-color:var(--accent);width:290px;box-shadow:0 0 0 4px rgba(138,109,59,.1)}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
  .mobile-search-btn{display:grid}

  .page{display:none;animation:fadeIn .4s cubic-bezier(.16,1,.3,1)}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .hero{
    position:relative;overflow:hidden;min-height:min(84vh,680px);display:grid;place-items:center;
    background:linear-gradient(125deg,#efe9df 0%,#f8f4ed 42%,#e6ddd0 100%);margin-bottom:56px;
  }
  [data-theme="dark"] .hero{background:linear-gradient(125deg,#1a1712,#24201a 50%,#16130f)}
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 78% 28%,rgba(201,169,106,.3),transparent 52%),
               radial-gradient(circle at 18% 75%,rgba(138,109,59,.14),transparent 55%);
  }
  .hero-content{position:relative;z-index:3;text-align:center;padding:56px 20px;max-width:780px}
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:999px;
    background:rgba(255,255,255,.66);border:1px solid rgba(138,109,59,.28);
    font-size:.78rem;font-weight:600;color:var(--accent);margin-bottom:24px;
    backdrop-filter:blur(10px);letter-spacing:.3px;
  }
  [data-theme="dark"] .hero-eyebrow{background:rgba(201,169,106,.12);border-color:rgba(201,169,106,.35)}
  .hero h1{font-size:clamp(2.1rem,6vw,4.3rem);font-weight:800;line-height:1.15;letter-spacing:-1.5px}
  .hero h1 span{
    display:block;background:linear-gradient(120deg,var(--gold-deep),var(--gold),var(--accent));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero p{color:var(--ink-soft);font-size:clamp(.95rem,1.7vw,1.15rem);margin:22px auto 34px;max-width:540px;line-height:1.8}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .hero-visual{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .hero-orb{
    position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;
    animation:orbFloat 12s ease-in-out infinite;
  }
  .hero-orb.a{width:380px;height:380px;background:rgba(201,169,106,.4);top:8%;right:6%}
  .hero-orb.b{width:300px;height:300px;background:rgba(138,109,59,.28);bottom:12%;left:8%;animation-delay:-4s}
  .hero-orb.c{width:200px;height:200px;background:rgba(230,200,150,.3);top:50%;left:42%;animation-delay:-8s}
  @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-30px) scale(1.08)}}
  .floating-card{
    position:absolute;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 20px;box-shadow:var(--shadow-lg);z-index:2;
    animation:float 6s ease-in-out infinite;display:none;border:1px solid rgba(255,255,255,.6);
  }
  [data-theme="dark"] .floating-card{background:rgba(40,36,30,.85);border-color:rgba(201,169,106,.2)}
  .floating-card small{display:block;font-size:.68rem;color:var(--ink-soft);margin-bottom:2px}
  .floating-card b{font-size:.95rem;font-weight:700}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @media(min-width:900px){
    .floating-card{display:block}
    .fc-1{top:16%;left:7%}
    .fc-2{bottom:20%;right:8%;animation-delay:1.6s}
    .fc-3{top:52%;right:14%;animation-delay:.8s}
  }

  .section{padding:34px 0}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .section-head h2{font-size:clamp(1.4rem,3.2vw,2rem);font-weight:800;letter-spacing:-.6px;line-height:1.3}
  .section-head p{color:var(--ink-soft);font-size:.9rem;margin-top:3px}
  .see-all{font-size:.86rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:5px;transition:.2s;cursor:pointer}
  .see-all:hover{gap:9px}

  .grid-products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:640px){.grid-products{grid-template-columns:repeat(3,1fr);gap:18px}}
  @media(min-width:1000px){.grid-products{grid-template-columns:repeat(4,1fr)}}
  .grid-products.cols-3{grid-template-columns:repeat(2,1fr)}
  @media(min-width:640px){.grid-products.cols-3{grid-template-columns:repeat(3,1fr)}}
  .card-product{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;
    position:relative;display:flex;flex-direction:column;cursor:pointer;
  }
  .card-product:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:transparent}
  .card-media{position:relative;aspect-ratio:3/4;overflow:hidden;background:#ece7df}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1)}
  .card-product:hover .card-media img{transform:scale(1.07)}
  .card-badge{
    position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:999px;
    background:var(--danger);color:#fff;font-size:.68rem;font-weight:700;z-index:2;
    backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  .card-badge.new{background:var(--ok)}
  .wish-btn{
    position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);
    transition:.2s;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .wish-btn:hover{background:#fff;transform:scale(1.12)}
  .wish-btn.active{color:var(--danger)}
  .tryon-badge{
    position:absolute;bottom:8px;right:8px;padding:4px 10px;border-radius:8px;
    background:rgba(23,22,20,.8);color:#fff;font-size:.62rem;font-weight:600;
    display:flex;align-items:center;gap:4px;backdrop-filter:blur(6px);z-index:2;
  }
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
  .card-cat{font-size:.66rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
  .card-name{font-size:.9rem;font-weight:600;line-height:1.45;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-price{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap;padding-top:4px}
  .card-price b{font-size:1rem;color:var(--ink);font-weight:700}
  .card-price s{font-size:.78rem;color:var(--ink-soft)}
  .card-price .off{
    font-size:.66rem;background:rgba(178,59,59,.12);color:var(--danger);
    padding:2px 7px;border-radius:6px;font-weight:700;
  }
  .card-colors{display:flex;gap:4px;margin-top:2px}
  .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(0,0,0,.1);flex-shrink:0}

  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:720px){.cat-grid{grid-template-columns:repeat(4,1fr);gap:16px}}
  .cat-card{
    position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;
    display:flex;align-items:flex-end;padding:16px;color:#fff;cursor:pointer;
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .cat-card:hover{transform:scale(1.03)}
  .cat-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.1) 55%,transparent)}
  .cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .cat-card:hover img{transform:scale(1.06)}
  .cat-card span{position:relative;z-index:1;font-weight:700;font-size:1rem;text-shadow:0 2px 8px rgba(0,0,0,.4)}

  .features{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:640px){.features{grid-template-columns:repeat(3,1fr)}}
  .feature{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;display:flex;gap:14px;align-items:flex-start;transition:.25s;
  }
  .feature:hover{box-shadow:var(--shadow)}
  .feature-ico{
    flex-shrink:0;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(201,169,106,.22),rgba(138,109,59,.1));color:var(--accent);
    font-size:1.2rem;
  }
  .feature h4{font-size:.92rem;margin-bottom:2px;font-weight:700}
  .feature p{font-size:.8rem;color:var(--ink-soft);line-height:1.5}

  .tryon-promo{
    border-radius:24px;overflow:hidden;position:relative;
    background:linear-gradient(120deg,#1f1c17,#332e26 55%,#1f1c17);color:#f4efe7;
    display:grid;grid-template-columns:1fr;min-height:360px;box-shadow:var(--shadow-lg);
  }
  @media(min-width:820px){.tryon-promo{grid-template-columns:1.15fr 1fr}}
  .tryon-promo-text{padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;z-index:2}
  .tryon-promo-text h2{font-size:clamp(1.5rem,3.5vw,2.3rem);line-height:1.3;font-weight:800}
  .tryon-promo-text h2 em{color:var(--gold);font-style:normal}
  .tryon-promo-text p{color:#c7bfb2;font-size:.94rem;max-width:420px;line-height:1.8}
  .tryon-promo-visual{
    position:relative;min-height:300px;overflow:hidden;
    background:radial-gradient(circle at 50% 42%,rgba(201,169,106,.3),transparent 62%),
               linear-gradient(160deg,#2b2620,#1b1814);
  }
  .tryon-promo-visual .ring{
    position:absolute;border-radius:50%;border:1px solid rgba(201,169,106,.28);
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  .tryon-promo-visual .ring:nth-child(1){width:200px;height:200px;animation:ringPulse 4s ease-in-out infinite}
  .tryon-promo-visual .ring:nth-child(2){width:290px;height:290px;border-style:dashed;opacity:.5;animation:ringPulse 4s ease-in-out infinite .8s}
  @keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.08);opacity:.8}}
  .mannequin-sil{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:120px;height:260px;
    filter:drop-shadow(0 16px 40px rgba(0,0,0,.6));
  }
  .mannequin-sil svg{width:100%;height:100%}

  .newsletter{
    background:linear-gradient(135deg,var(--ink),#2a2620);color:var(--bg);border-radius:24px;
    padding:clamp(28px,5vw,52px);margin:34px 0;display:grid;gap:20px;text-align:center;position:relative;overflow:hidden;
  }
  .newsletter::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(201,169,106,.2),transparent 50%);pointer-events:none}
  @media(min-width:720px){.newsletter{grid-template-columns:1fr auto;text-align:right;align-items:center}}
  .newsletter h3{font-size:clamp(1.2rem,2.8vw,1.7rem);font-weight:800;position:relative}
  .newsletter p{opacity:.7;font-size:.88rem;margin-top:4px;position:relative}
  .newsletter form{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative}
  .newsletter input{
    flex:1;min-width:200px;padding:12px 18px;border-radius:999px;border:none;
    background:rgba(255,255,255,.12);color:var(--bg);font-size:.9rem;
  }
  .newsletter input::placeholder{color:rgba(255,255,255,.5)}
  .newsletter input:focus{outline:2px solid var(--gold)}

  .footer{border-top:1px solid var(--line);padding:44px 0 24px;margin-top:40px}
  .footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  @media(min-width:720px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr}}
  .footer h5{font-size:.92rem;font-weight:700;margin-bottom:12px}
  .footer a,.footer li{display:block;font-size:.83rem;color:var(--ink-soft);padding:4px 0;transition:.18s}
  .footer a:hover{color:var(--accent);padding-inline-start:4px}
  .footer ul{list-style:none}
  .footer-brand p{font-size:.83rem;color:var(--ink-soft);margin-top:10px;max-width:290px;line-height:1.7}
  .socials{display:flex;gap:10px;margin-top:14px}
  .socials a{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;padding:0;transition:.2s;font-size:.75rem;font-weight:700;
  }
  .socials a:hover{background:var(--ink);color:var(--bg);border-color:var(--ink);padding-inline-start:0}
  .footer-bottom{
    border-top:1px solid var(--line);margin-top:32px;padding-top:18px;
    text-align:center;font-size:.76rem;color:var(--ink-soft);
  }

  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:70;height:var(--bottom-h);
    background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);
    border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:.6rem;color:var(--ink-soft);font-weight:500;position:relative;transition:.2s;
  }
  .bottom-nav button.active{color:var(--accent)}
  .bottom-nav button.active::before{
    content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);
  }
  .bottom-nav svg{width:22px;height:22px}
  .bottom-nav .badge{top:5px;left:calc(50% + 8px)}

  .shop-layout{display:grid;grid-template-columns:1fr;gap:24px;padding:20px 0}
  @media(min-width:900px){.shop-layout{grid-template-columns:260px 1fr}}
  .filters{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;height:fit-content;
  }
  .filters.desktop{display:none}
  @media(min-width:900px){.filters.desktop{display:block;position:sticky;top:calc(var(--header-h) + 16px)}}
  .filter-group{border-bottom:1px solid var(--line);padding:12px 0}
  .filter-group:first-child{padding-top:0}
  .filter-group:last-child{border-bottom:none;padding-bottom:0}
  .filter-group h4{font-size:.82rem;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.82rem;color:var(--ink-soft);cursor:pointer;transition:.15s}
  .chk:hover{color:var(--ink)}
  .chk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .price-range{display:flex;gap:8px;align-items:center}
  .price-range input{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);font-size:.8rem;
  }
  .price-range input:focus{outline:none;border-color:var(--accent)}
  .shop-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .shop-toolbar .count{font-size:.84rem;color:var(--ink-soft);margin-inline-end:auto;font-weight:600}
  .shop-toolbar select{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:.8rem;cursor:pointer;
  }
  .shop-toolbar select:focus{outline:none;border-color:var(--accent)}
  .filter-toggle-mobile{display:inline-flex}
  @media(min-width:900px){.filter-toggle-mobile{display:none}}
  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-soft)}
  .empty-state svg{margin:0 auto 16px;opacity:.35}

const CartManager = {
  save(){ Storage.set('cart', AppState.cart); updateBadges(); },
  add(p, size, colorIdx, qty=1){
    if(p.sizes.length && !size) throw new Error('لطفاً سایز را انتخاب کنید.');
    if(!size) size = p.sizes[0];
    if(!p.colors.length) colorIdx=0;
    if(colorIdx==null||colorIdx<0) throw new Error('لطفاً رنگ را انتخاب کنید.');
    const key = `${p.id}|${size}|${colorIdx}`;
    const ex = AppState.cart.find(i=>i.key===key);
    if(ex) ex.qty += qty;
    else AppState.cart.push({ key, id:p.id, name:p.name, price:finalPrice(p), size, colorIdx, qty, img:p.images[0] });
    this.save();
  },
  remove(key){ AppState.cart = AppState.cart.filter(i=>i.key!==key); this.save(); },
  setQty(key, q){ const it=AppState.cart.find(i=>i.key===key); if(it){ it.qty=Math.max(1,Math.min(99,q)); this.save(); } },
  count(){ return AppState.cart.reduce((s,i)=>s+i.qty,0); },
  subtotal(){ return AppState.cart.reduce((s,i)=>s+i.price*i.qty,0); },
  clear(){ AppState.cart=[]; this.save(); }
};

const WishlistManager = {
  save(){ Storage.set('wishlist', AppState.wishlist); updateBadges(); },
  toggle(id){ if(AppState.wishlist.includes(id)) AppState.wishlist=AppState.wishlist.filter(x=>x!==id); else AppState.wishlist.push(id); this.save(); return AppState.wishlist.includes(id); },
  has(id){ return AppState.wishlist.includes(id); }
};

const OrderManager = {
  create(order){
    order.id = 'ORD-'+Date.now().toString(36).toUpperCase();
    order.date = new Date().toISOString();
    order.status = 'در حال پردازش';
    AppState.orders.unshift(order);
    Storage.set('orders', AppState.orders);
    return order;
  },
  updateStatus(id, status){
    const o = AppState.orders.find(x=>x.id===id);
    if(o){ o.status=status; Storage.set('orders', AppState.orders); }
  }
};

const BlogManager = {
  save(){ Storage.set('posts', AppState.posts); },
  add(post){ post.id = uid(); post.date = todayISO(); AppState.posts.unshift(post); this.save(); return post; },
  remove(id){ AppState.posts = AppState.posts.filter(p=>p.id!==id); this.save(); },
  byId(id){ return AppState.posts.find(p=>p.id===id); }
};

function updateBadges(){
  const cb=$('#cartBadge'); if(cb){ cb.dataset.count=CartManager.count(); cb.textContent=CartManager.count()?fmt(CartManager.count()):''; }
  const wb=$('#wishBadge'); if(wb){ wb.dataset.count=AppState.wishlist.length; wb.textContent=AppState.wishlist.length?fmt(AppState.wishlist.length):''; }
}
function toast(msg, type=''){
  const wrap=$('#toastWrap'); if(!wrap) return;
  const t=el('div','toast '+(type||''), esc(msg));
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .32s'; setTimeout(()=>t.remove(),340); }, 2600);
}

const Router = {
  go(page, opts={}){
    AppState.page=page;
    $$('.page').forEach(p=>p.classList.remove('active'));
    const target=$('#app');
    target.innerHTML='';
    const view = Views[page]||Views.home;
    const node = view(opts);
    node.classList.add('page','active');
    target.appendChild(node);
    window.scrollTo({top:0,behavior:'instant'});
    $$('.nav-desktop button, .bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===page));
    document.body.dataset.page=page;
    updateBadges();
  }
};

function productCard(p){
  const off = p.salePrice && p.salePrice < p.price;
  const disc = off ? Math.round((1-p.salePrice/p.price)*100) : 0;
  const card = el('article','card-product');
  card.innerHTML = `
    <div class="card-media">
      <img loading="lazy" src="${p.images[0]}" alt="${esc(p.name)}" onerror="this.style.opacity=0">
      ${p.isNew?'<span class="card-badge new">جدید</span>':''}
      ${off?`<span class="card-badge">${fmt(disc)}٪</span>`:''}
      <button class="wish-btn ${WishlistManager.has(p.id)?'active':''}" data-wish="${p.id}" aria-label="افزودن به علاقه‌مندی‌ها">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="${WishlistManager.has(p.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.2C.4 8 2.3 4.3 6 4c2.2-.2 3.8 1 5 2.6C12.2 5 13.8 3.8 16 4c3.7.3 5.6 4 4 7.8-2.5 4.6-10 9.2-10 9.2Z"/></svg>
      </button>
      ${p.tryOn?'<span class="tryon-badge">◍ پرو مجازی</span>':''}
    </div>
    <div class="card-body">
      <span class="card-cat">${esc(p.gender==='men'?'مردانه':'زنانه')} · ${esc(p.category)}</span>
      <h3 class="card-name">${esc(p.name)}</h3>
      <div class="card-colors">${p.colors.map(c=>`<span class="dot" style="background:${c}"></span>`).join('')}</div>
      <div class="card-price">
        <b>${fmt(finalPrice(p))} تومان</b>
        ${off?`<s>${fmt(p.price)}</s><span class="off">${fmt(disc)}٪</span>`:''}
      </div>
    </div>`;
  card.addEventListener('click', e=>{
    if(e.target.closest('[data-wish]')) return;
    Router.go('product',{id:p.id});
  });
  card.querySelector('[data-wish]').addEventListener('click', e=>{
    e.stopPropagation();
    const on = WishlistManager.toggle(p.id);
    e.currentTarget.classList.toggle('active', on);
    e.currentTarget.querySelector('svg').setAttribute('fill', on?'currentColor':'none');
    toast(on?'به علاقه‌مندی‌ها اضافه شد':'از علاقه‌مندی‌ها حذف شد', on?'ok':'');
  });
  return card;
}

    const g=e.target.dataset.gender;

    if(onChange) onChange(); else Router.go('shop');
  }));
  container.querySelectorAll('[data-cat]').forEach(cb=>cb.addEventListener('change',e=>{
    const c=e.target.dataset.cat;
    if(e.target.checked) f.cat.push(c); else f.cat=f.cat.filter(x=>x!==c);
    if(onChange) onChange(); else Router.go('shop');
  }));
  container.querySelectorAll('[data-size]').forEach(b=>{
    b.classList.toggle('active', f.sizes.includes(b.dataset.size));
    b.addEventListener('click',()=>{
      const s=b.dataset.size;
      if(f.sizes.includes(s)) f.sizes=f.sizes.filter(x=>x!==s); else f.sizes.push(s);

    if(onChange) onChange(); else Router.go('shop');
  });
}

function filterProducts(){
  const f = AppState.filters;
  let list = ProductCatalog.slice();
  if(f.gender.length) list = list.filter(p=>f.gender.includes(p.gender));
  if(f.cat.length) list = list.filter(p=>f.cat.includes(p.category));
  if(f.sizes.length) list = list.filter(p=>p.sizes.some(s=>f.sizes.includes(s)));
  if(f.min!=null) list = list.filter(p=>finalPrice(p)>=f.min);
  if(f.max!=null) list = list.filter(p=>finalPrice(p)<=f.max);
  if(f.inStock) list = list.filter(p=>p.stock>0);
  if(f.q){
    const q=f.q.trim().toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q));
  }
  switch(f.sort){
    case 'cheap': list.sort((a,b)=>finalPrice(a)-finalPrice(b)); break;
    case 'expensive': list.sort((a,b)=>finalPrice(b)-finalPrice(a)); break;
    case 'popular': list.sort((a,b)=>b.popular-a.popular); break;
    default: list.sort((a,b)=> (b.isNew?1:0)-(a.isNew?1:0) || b.popular-a.popular);
  }
  return list;
}

Views.tryon = ({id}={})=>{
  const wrap = el('div');
  wrap.style.position='relative';
  wrap.innerHTML = `
    <div class="studio" id="studio">
      <div class="studio-canvas-wrap" id="canvasWrap">
        <div class="studio-hud">
          <button class="hud-btn" id="viewFront" title="نمای جلو">◉</button>
          <button class="hud-btn" id="viewBack" title="نمای پشت">◎</button>
          <button class="hud-btn" id="viewSide" title="نمای جانبی">◐</button>
          <button class="hud-btn" id="resetView" title="بازگشت">↺</button>
          <button class="hud-btn" id="toggleRotate" title="چرخش خودکار">⟳</button>
        </div>
        <div class="studio-hud right">
          <button class="hud-btn" id="toggleBg" title="پس‌زمینه">◑</button>
          <button class="hud-btn studio-mobile-toggle" id="openMobilePanel" title="کنترل‌ها">☰</button>
        </div>
        <div class="zoom-controls">
          <button class="hud-btn" id="zoomIn" title="بزرگ‌نمایی">+</button>
          <button class="hud-btn" id="zoomOut" title="کوچک‌نمایی">−</button>
        </div>
        <div class="loading-overlay" id="studioLoading"><div class="spinner"></div><p style="font-size:.8rem;color:var(--ink-soft);margin-top:12px" id="loadMsg">در حال بارگذاری مدل انسانی…</p></div>
      </div>
      <aside class="studio-panel" id="studioPanel"></aside>
      <div class="studio-mobile-panel" id="studioMobilePanel"></div>
    </div>
  `;
  const canvasWrap = wrap.querySelector('#canvasWrap');
  const loading = wrap.querySelector('#studioLoading');
  const loadMsg = wrap.querySelector('#loadMsg');
  let studio = null;

  const init = async ()=>{
    try{
      studio = new HumanViewer(canvasWrap);
      await studio.loadWithFallback(MODEL_URLS, (msg)=>{ if(loadMsg) loadMsg.textContent = msg; });
      loading.style.display='none';
      if(AppState._pendingStyle){
        const s = AppState._pendingStyle;
        s.items.forEach(it=>{ const p = productById(it.id); if(p) studio.putOn(p, it.size, it.colorIdx); });
        AppState._pendingStyle=null;
      } else if(AppState.lastTryOn){
        const p = productById(AppState.lastTryOn);
        if(p && p.tryOn) studio.putOn(p, p.sizes[0]||'M', 0);
        AppState.lastTryOn=null;
      }
      buildStudioPanels(wrap, studio);
    }catch(e){
      console.error('Human model load failed:', e);
      loading.style.display='none';
      canvasWrap.insertAdjacentHTML('beforeend', `<div class="webgl-fallback">
        <b>بارگذاری مدل انسانی ناموفق بود</b>
        <p style="font-size:.82rem;color:var(--ink-soft);max-width:340px;line-height:1.7">
          اتصال شبکه یا دسترسی به CDN را بررسی کنید. در صورت ادامه مشکل، از فروشگاه دوبعدی استفاده کنید.
        </p>
        <p style="font-size:.7rem;color:var(--warn);max-width:340px">خطا: ${esc(e.message||'unknown')}</p>
        <button class="btn btn-primary" data-nav="shop">رفتن به فروشگاه</button>
      </div>`);
      bindNavButtons(wrap);
    }
  };
  setTimeout(init, 30);

  wrap.querySelector('#viewFront')?.addEventListener('click',()=>studio?.view('front'));
  wrap.querySelector('#viewBack')?.addEventListener('click',()=>studio?.view('back'));
  wrap.querySelector('#viewSide')?.addEventListener('click',()=>studio?.view('side'));
  wrap.querySelector('#resetView')?.addEventListener('click',()=>studio?.reset());
  wrap.querySelector('#toggleRotate')?.addEventListener('click',e=>{
    const on = studio?.toggleAutoRotate();
    e.currentTarget.classList.toggle('active', !!on);
  });
  wrap.querySelector('#toggleBg')?.addEventListener('click',()=>studio?.toggleBg());
  wrap.querySelector('#openMobilePanel')?.addEventListener('click',()=>{
    wrap.querySelector('#studioMobilePanel').classList.toggle('open');
  });
  wrap.querySelector('#zoomIn')?.addEventListener('click',()=>studio?.zoom(0.8));
  wrap.querySelector('#zoomOut')?.addEventListener('click',()=>studio?.zoom(1.25));
  return wrap;
};

function buildStudioPanels(root, studio){
  const panel = root.querySelector('#studioPanel');
  const mob = root.querySelector('#studioMobilePanel');
  const render = (target)=>{
    target.innerHTML = `
      <div class="panel-tabs">
        <button class="active" data-tab="wardrobe">لباس‌ها</button>
        <button data-tab="body">بدن</button>
        <button data-tab="skin">ظاهر</button>
      </div>
      <div class="panel-content" id="panelContent"></div>
    `;
    const content = target.querySelector('#panelContent');
    target.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
      target.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderTab(b.dataset.tab, content, studio);
    }));
    renderTab('wardrobe', content, studio);
  };
  render(panel);
  if(mob) render(mob);
}
function renderTab(tab, content, studio){
  if(tab==='wardrobe') renderWardrobeTab(content, studio);
  else if(tab==='body') renderBodyTab(content, studio);
  else renderSkinTab(content, studio);
}

function renderWardrobeTab(content, studio){

      </div>

        ${tryonProducts.map(p=>`
          <div class="tryon-card ${worn.some(w=>w.id===p.id)?'active':''}" data-product="${p.id}">

      </div>
    </div>
    <div class="panel-section">
      <div class="cart-summary"><div class="row total"><span>مجموع استایل</span><span>${fmt(worn.reduce((s,w)=>s+finalPrice(productById(w.id)||{price:0}),0))} تومان</span></div></div>
    </div>
  `;
  content.querySelectorAll('#wornList [data-remove]').forEach(b=>b.addEventListener('click',()=>{
    studio.removeWorn(b.dataset.remove);
    renderWardrobeTab(content, studio);
    syncOtherPanel(content, 'wardrobe', studio);

  sheet.appendChild(body); sheet.appendChild(foot);
  document.body.appendChild(sheet);
  requestAnimationFrame(()=>{ sheet.classList.add('open'); $('#overlay').classList.add('open'); });

  const render = ()=>{
    const items = AppState.cart;
    if(!items.length){
      body.innerHTML = `<div class="empty-state"><h3>سبد خرید خالی است</h3><p>محصولی اضافه کنید.</p></div>`;
      foot.innerHTML='';
    } else {
      body.innerHTML = items.map(it=>`
        <div class="cart-item">
          <img src="${it.img}" alt="">
          <div class="cart-item-info"><b>${esc(it.name)}</b><small>سایز ${it.size} · رنگ ${it.colorIdx+1}</small>
            <div class="qty"><button data-q="-1" data-key="${it.key}">−</button><span>${it.qty}</span><button data-q="1" data-key="${it.key}">+</button></div>
          </div>
          <div class="price-col"><b>${fmt(it.price*it.qty)} تومان</b><button class="rm" data-rm="${it.key}">حذف</button></div>
        </div>`).join('');
      const ship = CartManager.subtotal()>=5000000?0:250000;
      foot.innerHTML = `
        <div class="cart-summary">
          <div class="row"><span>جمع محصولات</span><span>${fmt(CartManager.subtotal())} تومان</span></div>
          <div class="row"><span>هزینه ارسال</span><span>${ship?'۲۵۰,۰۰۰ تومان':'رایگان'}</span></div>
          <div class="row total"><span>مبلغ نهایی</span><span>${fmt(CartManager.subtotal()+ship)} تومان</span></div>
          <button class="btn btn-primary btn-block" id="goCheckout" style="margin-top:10px">ادامه به تسویه‌حساب</button>
          <button class="btn btn-outline btn-block" id="keepShopping" style="margin-top:8px">ادامه خرید</button>
        </div>`;
      foot.querySelector('#goCheckout').addEventListener('click',()=>{ close(); Router.go('checkout'); });
      foot.querySelector('#keepShopping').addEventListener('click',()=>{ close(); Router.go('shop'); });
    }
    body.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
      const it = AppState.cart.find(i=>i.key===b.dataset.key);
      if(it){ CartManager.setQty(it.key, it.qty+Number(b.dataset.q)); render(); }
    }));
    body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ CartManager.remove(b.dataset.rm); render(); }));
  };
  render();
  const close = ()=>{ sheet.classList.remove('open'); $('#overlay').classList.remove('open'); setTimeout(()=>sheet.remove(),350); };
  sheet.querySelector('[data-close]').addEventListener('click',close);
  $('#overlay').onclick = close;
}

          </div>
          <div class="form-card">
            <h3>روش ارسال</h3>
            <label class="ship-opt"><input type="radio" name="ship" value="standard" checked> استاندارد (۲–۴ روز) — ${shipping?fmt(shipping)+' تومان':'رایگان'}</label>
            <label class="ship-opt"><input type="radio" name="ship" value="express"> سریع (۲۴ ساعته) — ${fmt(450000)} تومان</label>
          </div>
          <button class="btn btn-primary btn-block" type="submit">ثبت سفارش آزمایشی</button>
        </form>
        <aside class="order-summary">
          <div class="form-card">
            <h3>خلاصه سفارش</h3>
            ${AppState.cart.length?AppState.cart.map(it=>`<div class="cart-summary" style="margin-bottom:8px"><div class="row"><span>${esc(it.name)} × ${it.qty}</span><span>${fmt(it.price*it.qty)}</span></div></div>`).join(''):'<p style="font-size:.84rem;color:var(--ink-soft)">سبد خرید خالی است.</p>'}
            <div class="cart-summary" style="margin-top:12px">
              <div class="row"><span>جمع</span><span>${fmt(subtotal)}</span></div>
              <div class="row"><span>ارسال</span><span>${shipping?fmt(shipping):'رایگان'}</span></div>
              <div class="row total"><span>مبلغ نهایی</span><span>${fmt(subtotal+shipping)} تومان</span></div>
            </div>
            <p style="font-size:.68rem;color:var(--warn);margin-top:10px;background:rgba(192,122,42,.1);padding:8px 10px;border-radius:8px">⚠️ این تسویه‌حساب آزمایشی است.</p>
          </div>
        </aside>
      </div>
    </div>
    ${footerHTML()}
  `;
  const form = wrap.querySelector('#checkoutForm');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    let valid = true;
    form.querySelectorAll('[required]').forEach(inp=>{
      const field = inp.closest('.field');
      const ok = inp.checkValidity() && inp.value.trim()!=='';
      field?.classList.toggle('has-error', !ok);
      if(!ok) valid=false;
    });
    if(!valid){ toast('لطفاً فیلدهای الزامی را تکمیل کنید','err'); return; }
    if(!AppState.cart.length){ toast('سبد خرید خالی است','err'); return; }
    const fd = new FormData(form);
    const order = {
      customer: { name: fd.get('fname')+' '+fd.get('lname'), email:fd.get('email'), phone:fd.get('phone') },
      address: { province:fd.get('province'), city:fd.get('city'), address:fd.get('address'), postal:fd.get('postal') },
      ship: fd.get('ship'),
      items: AppState.cart.map(i=>({...i})),
      total: subtotal + (fd.get('ship')==='express'?450000:shipping)
    };
    const saved = OrderManager.create(order);
    CartManager.clear();
    showOrderConfirm(wrap, saved.total, saved.id);
  });
  bindNavButtons(wrap);
  return wrap;
};

function openPostEditor(postId, onSave){
  const post = postId ? BlogManager.byId(postId) : null;
  const m = el('div','modal open');
  m.innerHTML = `<div class="modal-box" style="max-width:620px">
    <button class="modal-close" data-close>✕</button>
    <h3>${post?'ویرایش پست':'پست جدید'}</h3>
    <div class="field"><label>عنوان *</label><input id="postTitle" value="${esc(post?.title||'')}"></div>
    <div class="field"><label>لینک تصویر کاور</label><input id="postCover" value="${esc(post?.cover||IMG.blog1)}"></div>
    <div class="field"><label>برچسب</label><input id="postTag" value="${esc(post?.tag||'مقاله')}"></div>
    <div class="field"><label>نویسنده</label><input id="postAuthor" value="${esc(post?.author||'تیم VESTORA')}"></div>
    <div class="field"><label>خلاصه</label><textarea id="postExcerpt" rows="2">${esc(post?.excerpt||'')}</textarea></div>
    <div class="field"><label>متن کامل (HTML مجاز)</label><textarea id="postContent" rows="6">${esc(post?.content||'')}</textarea></div>
    <button class="btn btn-primary btn-block" id="savePost">${post?'ذخیره تغییرات':'انتشار پست'}</button>
  </div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('[data-close]').addEventListener('click',close);
  m.addEventListener('click',e=>{ if(e.target===m) close(); });
  m.querySelector('#savePost').addEventListener('click',()=>{
    const title = m.querySelector('#postTitle').value.trim();
    if(!title){ toast('عنوان الزامی است','err'); return; }
    const data = {
      title, cover: m.querySelector('#postCover').value.trim() || IMG.blog1,
      tag: m.querySelector('#postTag').value.trim() || 'مقاله',
      author: m.querySelector('#postAuthor').value.trim() || 'تیم VESTORA',
      excerpt: m.querySelector('#postExcerpt').value.trim(),
      content: m.querySelector('#postContent').value.trim()
    };
    if(post){ Object.assign(post, data); BlogManager.save(); toast('پست به‌روزرسانی شد ✓','ok'); }
    else { BlogManager.add(data); toast('پست منتشر شد ✓','ok'); }
    close();
    if(onSave) onSave();
  });
}

/* =========================================================
   HumanViewer — Soldier.glb from Three.js official repo
   + FULL BODY framing (100x zoom out) + clothing replace
   ========================================================= */
class HumanViewer{
  constructor(container){
    this.container = container;
    this.worn = [];
    this.settings = { heightScale:1.0, size:'M', gender:'women' };
    this.skinIdx = 1;
    this.hairIdx = 1;
    this.bgIdx = 0;
    this.autoRotate = false;
    this._ready = false;
    this._initScene();
  }

  _initScene(){
    const w = this.container.clientWidth || 600;
    const h = this.container.clientHeight || 500;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xe8e1d5);

    // FIX: VERY WIDE initial distance for full body
    this.camera = new THREE.PerspectiveCamera(25, w/h, 0.05, 500);
    this.camera.position.set(0, 1.0, 8.0);
    this.baseCameraPos = new THREE.Vector3(0, 1.0, 8.0);
    this.baseTarget = new THREE.Vector3(0, 0.95, 0);

    this.renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(w,h);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.05;
    this.container.appendChild(this.renderer.domElement);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.06;
    this.controls.target.set(0, 0.95, 0);
    this.controls.minDistance = 0.2;
    this.controls.maxDistance = 30.0;
    this.controls.maxPolarAngle = Math.PI * 0.95;
    this.controls.minPolarAngle = 0.02;
    this.controls.enableZoom = true;
    this.controls.zoomSpeed = 2.0;
    this.controls.enablePan = false;
    this.controls.update();

    this.scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a7a62, 1.1));

    const key = new THREE.DirectionalLight(0xfff2dd, 2.0);
    key.position.set(2.0, 3.5, 2.5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024,1024);
    key.shadow.camera.left=-2; key.shadow.camera.right=2;
    key.shadow.camera.top=3; key.shadow.camera.bottom=-1;
    key.shadow.bias = -0.0005;
    this.scene.add(key);

    const fill = new THREE.DirectionalLight(0xcfd8ff, 0.55);
    fill.position.set(-2.5, 2.0, 1.2);
    this.scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffe0b0, 0.7);
    rim.position.set(-1.0, 2.5, -2.5);
    this.scene.add(rim);

    const floorGeo = new THREE.CircleGeometry(3.5, 64);
    const floorMat = new THREE.MeshStandardMaterial({color:0xd8cfc1, roughness:0.95, metalness:0});
    this.floor = new THREE.Mesh(floorGeo, floorMat);
    this.floor.rotation.x = -Math.PI/2;
    this.floor.position.y = 0.001;
    this.floor.receiveShadow = true;
    this.scene.add(this.floor);

    this._animate = this._animate.bind(this);
    this._animate();

    this._onResize = debounce(()=>this._resize(), 150);
    window.addEventListener('resize', this._onResize);
  }

  loadWithFallback(urls, onProgress){
    return new Promise((resolve, reject)=>{
      const loader = new GLTFLoader();
      let idx = 0;
      const attempt = ()=>{
        if(idx >= urls.length){
          reject(new Error('All model URLs failed — network/CORS issue. Please check console.'));
          return;
        }
        const url = urls[idx++];
        if(onProgress) onProgress(`تلاش ${idx}/${urls.length} برای بارگذاری…`);
        loader.load(
          url,
          (gltf)=>{
            try{
              this.model = gltf.scene;
              this.model.position.y = 0;
              this.model.traverse(obj=>{
                if(obj.isMesh){
                  obj.castShadow = true;
                  obj.receiveShadow = true;
                  if(obj.material) obj.material.envMapIntensity = 1.0;
                }
              });
              const box = new THREE.Box3().setFromObject(this.model);
              const size = box.getSize(new THREE.Vector3());
              if(size.y > 0){
                const s = 1.75 / size.y;
                this.model.scale.setScalar(s);
              }
              box.setFromObject(this.model);
              const center = box.getCenter(new THREE.Vector3());
              this.model.position.x = -center.x;
              this.model.position.z = -center.z;
              this.model.position.y = -box.min.y;
              this.scene.add(this.model);

              this.skinMaterials = [];
              this.hairMaterials = [];
              this.model.traverse(obj=>{
                if(obj.isMesh && obj.material){
                  const name = (obj.material.name||'').toLowerCase();
                  const meshName = (obj.name||'').toLowerCase();
                  if(name.includes('skin') || meshName.includes('body') || meshName.includes('head')){
                    this.skinMaterials.push(obj.material);
                  }
                  if(name.includes('hair') || meshName.includes('hair')){
                    this.hairMaterials.push(obj.material);
                  }
                }
              });
              this._applySkinColor();
              this._applyHairColor();

              this._fitCameraToModel();

              this._ready = true;
              if(onProgress) onProgress('مدل بارگذاری شد');
              resolve();
            }catch(err){ reject(err); }
          },
          (xhr)=>{
            if(onProgress && xhr.total){
              const pct = Math.round(xhr.loaded/xhr.total*100);
              onProgress(`بارگذاری ${pct}%`);
            }
          },
          (err)=>{
            console.warn(`Failed to load ${url}:`, err);
            attempt();
          }
        );
      };
      attempt();
    });
  }

  // FIX: EXTREME 100x zoom out for FULL BODY
  _fitCameraToModel(){
    if(!this.model) return;
    const box = new THREE.Box3().setFromObject(this.model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const height = size.y || 1.75;

    this.controls.target.set(0, center.y, 0);

    // EXTREME: distance = 100 * height
    const dist = height * 100;

    this.camera.position.set(0, center.y, dist);
    this.camera.lookAt(this.controls.target);

    this.baseCameraPos = this.camera.position.clone();
    this.baseTarget = this.controls.target.clone();

    this.controls.minDistance = Math.max(0.2, dist * 0.05);
    this.controls.maxDistance = dist * 3.0;
    this.controls.update();
  }

  _animate(){
    requestAnimationFrame(this._animate);
    if(this.autoRotate && this.model) this.model.rotation.y += 0.005;
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  _resize(){
    const w = this.container.clientWidth, h = this.container.clientHeight;
    if(!w||!h) return;
    this.camera.aspect = w/h; this.camera.updateProjectionMatrix();
    this.renderer.setSize(w,h);
  }

  _applySkinColor(){
    const colors = [0xf3d7c1,0xe6bfa5,0xd1a17a,0xb47b52,0x8d5a3a,0x5d3a26];
    const col = new THREE.Color(colors[this.skinIdx] ?? colors[0]);
    this.skinMaterials?.forEach(m=>{ if(m.color) m.color.copy(col); });
  }
  _applyHairColor(){
    const colors = [0x1c1a17,0x3a2a1e,0x6b4b2f,0xb08a5c,0xe8d3a8];
    const col = new THREE.Color(colors[this.hairIdx] ?? colors[0]);
    this.hairMaterials?.forEach(m=>{ if(m.color) m.color.copy(col); });
  }

  putOn(product, size='M', colorIdx=0){
    const key = product.id + '|' + size + '|' + colorIdx;
    const sameCat = this.worn.filter(w=>{
      const p = productById(w.id);
      return p && p.category === product.category;
    });
    sameCat.forEach(w=>this.removeWorn(w.key));
    this.worn.push({key, id:product.id, size, colorIdx, category:product.category});
    this._applyClothes();
  }
  removeWorn(key){ this.worn = this.worn.filter(w=>w.key!==key); this._applyClothes(); }
  clearWorn(){ this.worn=[]; this._applyClothes(); }
  getWorn(){ return this.worn.slice(); }

  _applyClothes(){
    if(!this.model) return;
    if(this.clothesGroup){
      this.model.remove(this.clothesGroup);
      this.clothesGroup.traverse(n=>{ if(n.geometry) n.geometry.dispose?.(); if(n.material && !n.material.__shared) n.material.dispose?.(); });
    }
    this.clothesGroup = new THREE.Group();
    this.model.add(this.clothesGroup);

    const box = new THREE.Box3().setFromObject(this.model);
    const height = box.max.y - box.min.y;
    const feetY = box.min.y;
    const headY = box.max.y;
    const bodyWidth = box.max.x - box.min.x;
    const bodyDepth = box.max.z - box.min.z;
    const bodyCenterX = (box.max.x + box.min.x) / 2;
    const bodyCenterZ = (box.max.z + box.min.z) / 2;

    const shoulderY = headY - height * 0.16;
    const chestY = headY - height * 0.26;
    const waistY = headY - height * 0.40;
    const hipY = headY - height * 0.50;
    const kneeY = feetY + height * 0.28;
    const ankleY = feetY + height * 0.05;

    const bodyR = Math.max(bodyWidth, bodyDepth) * 0.5;
    const wrapR = bodyR * 0.85;

    this.worn.forEach(w=>{
      const p = productById(w.id);
      if(!p) return;
      const col = p.colors[w.colorIdx||0] || '#888';
      const mat = new THREE.MeshStandardMaterial({
        color:new THREE.Color(col),
        roughness:.75,
        metalness:.02,
        side:THREE.DoubleSide
      });
      mat.__shared = false;

      const cat = p.category;
      const isTop = ['تی‌شرت و پولوشرت','پیراهن','بلوز و شومیز','تی‌شرت','کت و بلیزر','کت و مانتو','لباس رسمی'].includes(cat);
      const isBottom = ['شلوار','جین','شلوار و جین','دامن'].includes(cat);
      const isDress = ['پیراهن و لباس مجلسی'].includes(cat);
      const isShoe = ['کفش'].includes(cat);
      const isAcc = ['اکسسوری','کیف و اکسسوری'].includes(cat);

      if(isTop || isDress){
        const topY = shoulderY + height * 0.02;
        const bottomY = isDress ? (kneeY + height * 0.05) : (waistY + height * 0.02);
        const topHeight = topY - bottomY;
        const geo = new THREE.CylinderGeometry(
          wrapR * 1.02, wrapR * 0.85, topHeight, 32, 1, true
        );
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(bodyCenterX, (topY + bottomY) / 2, bodyCenterZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.clothesGroup.add(mesh);

        if(!isDress && isTop){
          const sleeveLen = height * 0.10;
          for(const s of [-1,1]){
            const sleeveGeo = new THREE.CylinderGeometry(
              wrapR * 0.32, wrapR * 0.28, sleeveLen, 16, 1, true
            );
            const sm = new THREE.Mesh(sleeveGeo, mat);
            sm.position.set(
              bodyCenterX + s * (wrapR * 1.05),
              topY - sleeveLen * 0.5,
              bodyCenterZ
            );
            sm.rotation.z = s * 0.15;
            sm.castShadow = true;
            this.clothesGroup.add(sm);
          }
        }
      }
      
      if(isBottom && !isDress){
        const topY = hipY + height * 0.02;
        const bottomY = cat === 'دامن' ? (kneeY + height * 0.02) : (ankleY + height * 0.02);
        const botHeight = topY - bottomY;
        const geo = new THREE.CylinderGeometry(
          wrapR * 0.95, wrapR * (cat === 'دامن' ? 1.3 : 0.75), botHeight, 28, 1, true
        );
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(bodyCenterX, (topY + bottomY) / 2, bodyCenterZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.clothesGroup.add(mesh);

        if(cat !== 'دامن'){
          const legTop = hipY;
          const legBottom = ankleY;
          const legHeight = legTop - legBottom;
          const legOffset = wrapR * 0.45;
          for(const s of [-1,1]){
            const legGeo = new THREE.CylinderGeometry(
              wrapR * 0.38, wrapR * 0.20, legHeight, 16, 1, true
            );
            const lm = new THREE.Mesh(legGeo, mat);
            lm.position.set(
              bodyCenterX + s * legOffset,
              (legTop + legBottom) / 2,
              bodyCenterZ
            );
            lm.castShadow = true;
            this.clothesGroup.add(lm);
          }
        }
      }
      
      if(isShoe){
        for(const s of [-1,1]){
          const shoeGeo = new THREE.BoxGeometry(
            wrapR * 0.42, height * 0.035, wrapR * 0.85
          );
          const sm = new THREE.Mesh(shoeGeo, mat);
          sm.position.set(
            bodyCenterX + s * (wrapR * 0.42),
            feetY + height * 0.02,
            bodyCenterZ + wrapR * 0.2
          );
          sm.castShadow = true;
          this.clothesGroup.add(sm);
        }
      }
      
      if(isAcc){
        const ringGeo = new THREE.TorusGeometry(wrapR * 0.55, height * 0.005, 8, 32);
        const rm = new THREE.Mesh(ringGeo, mat);
        rm.position.set(bodyCenterX, shoulderY - height * 0.03, bodyCenterZ + bodyDepth * 0.05);
        rm.rotation.x = Math.PI / 2;
        this.clothesGroup.add(rm);
      }
    });
  }

  setSkin(idx){ this.skinIdx = idx; this._applySkinColor(); }
  getSkin(){ return this.skinIdx; }
  setHair(idx){ this.hairIdx = idx; this._applyHairColor(); }
  getHair(){ return this.hairIdx; }
  setBody(key, val){
    if(key==='heightScale'){
      this.settings.heightScale = val;
      if(this.model){
        if(!this._baseScale) this._baseScale = this.model.scale.x;
        this.model.scale.setScalar(this._baseScale * val);
      }
      return;
    }
    this.settings[key] = val;
  }
  getBodySettings(){ return {...this.settings}; }

  view(dir){
    if(!this.model) return;
    const box = new THREE.Box3().setFromObject(this.model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const height = size.y || 1.75;
    // EXTREME distance
    const dist = height * 100;
    
    this.controls.target.set(0, center.y, 0);
    if(dir==='front') this.camera.position.set(0, center.y, dist);
    if(dir==='back') this.camera.position.set(0, center.y, -dist);
    if(dir==='side') this.camera.position.set(dist, center.y, 0);
    this.camera.lookAt(this.controls.target);
    this.controls.update();
  }
  reset(){
    if(this.baseTarget){
      this.camera.position.copy(this.baseCameraPos);
      this.controls.target.copy(this.baseTarget);
    } else {
      this.camera.position.set(0, 1.0, 8.0);
      this.controls.target.set(0, 0.95, 0);
    }
    this.controls.update();
  }
  zoom(factor){
    const dir = new THREE.Vector3().subVectors(this.camera.position, this.controls.target);
    const dist = dir.length();
    const newDist = Math.max(this.controls.minDistance, Math.min(this.controls.maxDistance, dist * factor));
    dir.setLength(newDist);
    this.camera.position.copy(this.controls.target).add(dir);
    this.controls.update();
  }
  toggleAutoRotate(){ this.autoRotate = !this.autoRotate; return this.autoRotate; }
  toggleBg(){
    const bgs = [0xe8e1d5, 0x181512, 0x25201a, 0x2b3440];
    this.bgIdx = (this.bgIdx+1) % bgs.length;
    this.scene.background = new THREE.Color(bgs[this.bgIdx]);
    if(this.floor) this.floor.material.color.setHex(this.bgIdx===0?0xd8cfc1:0x2a2520);
  }
}

function boot(){
  document.documentElement.dataset.theme = AppState.theme;
  updateBadges();

  $$('[data-nav]').forEach(n=>{
    if(n.closest('#app')) return;
    n.addEventListener('click',e=>{
      e.preventDefault();
      const t=n.dataset.nav;
      if(t==='tryon') Router.go('tryon');
      else if(t==='men'||t==='women'){ AppState.filters.cat=[]; Router.go(t); }
      else Router.go(t);
    });
  });

  $('#cartBtn').addEventListener('click', openCartSheet);
  $('#wishlistBtn')?.addEventListener('click',()=>Router.go('wishlist'));

  $('#themeToggle').addEventListener('click',()=>{
    AppState.theme = AppState.theme==='light'?'dark':'light';
    Storage.set('theme', AppState.theme);
    document.documentElement.dataset.theme = AppState.theme;
  });

  const searchInput = $('#headerSearch');
  searchInput?.addEventListener('input', debounce(e=>{
    AppState.filters.q = e.target.value;
    if(AppState.page!=='shop') Router.go('shop');
    else {
      const grid = $('#shopGrid');
      if(grid){
        const list = filterProducts();
        grid.innerHTML='';
        list.forEach(p=>grid.appendChild(productCard(p)));
        const c = $('#shopGrid')?.closest('.shop-layout')?.querySelector('.count');
        if(c) c.textContent = fmt(list.length)+' نتیجه';
      }
    }
  }, 280));

  $('#mobileSearchBtn')?.addEventListener('click',()=>{
    const sheet = el('div','sheet bottom');
    sheet.innerHTML = `<div class="sheet-head"><h3>جست‌وجو</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="sheet-body"><input type="search" id="mobileSearchInput" placeholder="نام محصول…" style="width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:.92rem" autofocus></div>`;
    document.body.appendChild(sheet);
    requestAnimationFrame(()=>{ sheet.classList.add('open'); $('#overlay').classList.add('open'); });
    const close=()=>{ sheet.classList.remove('open'); $('#overlay').classList.remove('open'); setTimeout(()=>sheet.remove(),340); };
    sheet.querySelector('[data-close]').addEventListener('click',close);
    $('#overlay').onclick = close;
    const input = sheet.querySelector('#mobileSearchInput');
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ AppState.filters.q = input.value; close(); Router.go('shop'); }
    });
  });

  Router.go('home');
}

document.addEventListener('DOMContentLoaded', boot);
window.VESTORA = { AppState, ProductCatalog, CartManager, WishlistManager, OrderManager, BlogManager, Router, HumanViewer };
</script>
