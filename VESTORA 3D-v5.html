<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes">
<meta name="theme-color" content="#171614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VESTORA 3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="VESTORA 3D">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     RESPONSIVE MOBILE-FIRST — full audit
     ========================================================== */
  :root{
    --bg:#faf8f5; --surface:#ffffff; --ink:#171614; --ink-soft:#6b655c;
    --line:#e9e4dc; --accent:#8a6d3b; --accent-soft:#c9a96a; --gold:#c9a96a; --gold-deep:#a8874e;
    --danger:#b23b3b; --ok:#2f7d4f; --warn:#c07a2a;
    --radius:14px; --radius-sm:10px;
    --shadow:0 4px 18px rgba(20,20,20,.05); --shadow-lg:0 20px 50px rgba(20,20,20,.13);
    --header-h:56px; --bottom-h:60px;
    --font:"Vazirmatn",system-ui,sans-serif;
    --glass:rgba(255,255,255,.85);
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
  }
  [data-theme="dark"]{
    --bg:#0f0f0f; --surface:#1a1a1a; --ink:#f3efe8; --ink-soft:#a09a90;
    --line:#2b2b2b; --glass:rgba(20,20,20,.88);
    --shadow:0 4px 18px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    line-height:1.6;overflow-x:hidden;width:100%;
    padding-bottom:calc(var(--bottom-h) + var(--safe-bottom));
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overscroll-behavior-y:contain;
    font-size:14px;
  }
  img{max-width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;font-size:inherit}
  a{color:inherit;text-decoration:none}
  input,select,textarea{font-family:inherit;font-size:16px;max-width:100%}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

  .container{
    width:100%;
    max-width:1280px;
    margin-inline:auto;
    padding-left:calc(12px + var(--safe-left));
    padding-right:calc(12px + var(--safe-right));
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 20px;border-radius:999px;font-weight:600;font-size:.85rem;
    transition:transform .15s ease,background .2s ease,box-shadow .2s ease,border-color .2s;
    border:1.5px solid transparent;white-space:nowrap;line-height:1.2;min-height:40px;
    max-width:100%;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--ink);color:var(--bg)}
  .btn-primary:hover{background:var(--accent)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff}
  .btn-outline{border-color:var(--line);background:var(--surface)}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  .btn-danger{background:rgba(178,59,59,.1);color:var(--danger)}
  .btn-sm{padding:7px 14px;font-size:.76rem;min-height:34px}
  .btn-xs{padding:4px 10px;font-size:.68rem;min-height:28px}
  .btn-block{width:100%}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    transition:background .2s;position:relative;color:var(--ink);flex-shrink:0;
  }
  .icon-btn:active{background:var(--line)}
  .badge{
    position:absolute;top:2px;left:2px;min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--accent);color:#fff;font-size:.6rem;
    display:grid;place-items:center;font-weight:700;
  }
  .badge:empty,.badge[data-count="0"]{display:none}

  /* ============ HEADER ============ */
  .header{
    position:sticky;top:0;z-index:60;background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
    border-bottom:1px solid var(--line);
    height:calc(var(--header-h) + var(--safe-top));
    padding-top:var(--safe-top);
    display:flex;align-items:center;width:100%;
  }
  .header-inner{
    display:flex;align-items:center;gap:6px;
    width:100%;max-width:1280px;margin-inline:auto;
    padding-inline:calc(10px + var(--safe-left)) calc(10px + var(--safe-right));
  }
  .logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1rem;flex-shrink:0}
  .logo-mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(135deg,var(--ink),var(--accent));
    color:#fff;display:grid;place-items:center;font-size:.9rem;font-weight:800;
    flex-shrink:0;
  }
  .logo small{display:block;font-size:.5rem;font-weight:500;color:var(--accent);letter-spacing:2px;line-height:1}
  .nav-desktop{display:none}
  .header-actions{margin-inline-start:auto;display:flex;align-items:center;gap:0}
  .search-wrap{display:none}
  .mobile-search-btn{display:grid}

  /* ============ BOTTOM NAV ============ */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:70;
    height:calc(var(--bottom-h) + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);
    width:100%;
  }
  .bottom-nav button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:.55rem;color:var(--ink-soft);font-weight:500;position:relative;transition:.2s;
    min-height:44px;padding:4px 2px;
  }
  .bottom-nav button.active{color:var(--accent)}
  .bottom-nav button.active::before{
    content:"";position:absolute;top:0;width:22px;height:2px;border-radius:0 0 2px 2px;background:var(--accent);
  }
  .bottom-nav svg{width:20px;height:20px}
  .bottom-nav .badge{top:4px;left:calc(50% + 6px)}

  .page{display:none;animation:fadeIn .3s ease}
  .page.active{display:block;width:100%}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ============ HERO ============ */
  .hero{
    position:relative;overflow:hidden;min-height:auto;
    background:linear-gradient(125deg,#efe9df 0%,#f8f4ed 42%,#e6ddd0 100%);
    margin-bottom:24px;padding:40px 0;
  }
  [data-theme="dark"] .hero{background:linear-gradient(125deg,#1a1712,#24201a 50%,#16130f)}
  .hero-content{position:relative;z-index:3;text-align:center;padding:20px 12px;width:100%}
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    background:rgba(255,255,255,.66);border:1px solid rgba(138,109,59,.28);
    font-size:.68rem;font-weight:600;color:var(--accent);margin-bottom:14px;
  }
  [data-theme="dark"] .hero-eyebrow{background:rgba(201,169,106,.12);border-color:rgba(201,169,106,.35)}
  .hero h1{font-size:clamp(1.6rem,7vw,3rem);font-weight:800;line-height:1.2;letter-spacing:-.5px}
  .hero h1 span{
    display:block;background:linear-gradient(120deg,var(--gold-deep),var(--gold),var(--accent));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .hero p{color:var(--ink-soft);font-size:.85rem;margin:12px auto 18px;max-width:100%;line-height:1.7}
  .hero-cta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%}
  .hero-cta .btn{font-size:.78rem;padding:9px 16px;min-height:36px}
  .hero-visual{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .hero-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
  .hero-orb.a{width:200px;height:200px;background:rgba(201,169,106,.4);top:8%;right:6%}
  .hero-orb.b{width:160px;height:160px;background:rgba(138,109,59,.28);bottom:12%;left:8%}
  .hero-orb.c{display:none}
  .floating-card{display:none}

  /* ============ SECTION ============ */
  .section{padding:16px 0}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap;width:100%}
  .section-head > div{min-width:0;flex:1}
  .section-head h2{font-size:1.05rem;font-weight:800;letter-spacing:-.3px;line-height:1.3}
  .section-head p{color:var(--ink-soft);font-size:.72rem;margin-top:1px}
  .see-all{font-size:.72rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:3px;cursor:pointer;flex-shrink:0}

  /* ============ PRODUCT GRID — 2 col mobile, responsive ============ */
  .grid-products{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:8px;
    width:100%;
  }
  @media(min-width:560px){.grid-products{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}
  @media(min-width:820px){.grid-products{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
  .grid-products.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(min-width:560px){.grid-products.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}}

  .card-product{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--line);transition:transform .2s,box-shadow .2s;
    position:relative;display:flex;flex-direction:column;cursor:pointer;
    min-width:0;
  }
  .card-product:active{transform:scale(.98)}
  @media(hover:hover){.card-product:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}}
  .card-media{position:relative;aspect-ratio:3/4;overflow:hidden;background:#ece7df;width:100%}
  .card-media img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .card-badge{
    position:absolute;top:5px;right:5px;padding:2px 6px;border-radius:999px;
    background:var(--danger);color:#fff;font-size:.56rem;font-weight:700;z-index:2;
  }
  .card-badge.new{background:var(--ok)}
  .wish-btn{
    position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);
    z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.1);
  }
  .wish-btn:active{transform:scale(.9)}
  .wish-btn.active{color:var(--danger)}
  .tryon-badge{
    position:absolute;bottom:5px;right:5px;padding:2px 6px;border-radius:5px;
    background:rgba(23,22,20,.8);color:#fff;font-size:.52rem;font-weight:600;
    display:flex;align-items:center;gap:2px;z-index:2;
  }
  .card-body{padding:7px 8px 9px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .card-cat{font-size:.54rem;color:var(--ink-soft);letter-spacing:.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-name{font-size:.74rem;font-weight:600;line-height:1.35;min-height:2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-price{display:flex;align-items:center;gap:4px;margin-top:auto;flex-wrap:wrap;padding-top:2px}
  .card-price b{font-size:.78rem;color:var(--ink);font-weight:700;white-space:nowrap}
  .card-price s{font-size:.62rem;color:var(--ink-soft)}
  .card-price .off{font-size:.54rem;background:rgba(178,59,59,.12);color:var(--danger);padding:1px 4px;border-radius:4px;font-weight:700}
  .card-colors{display:flex;gap:2px;margin-top:1px}
  .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.1);flex-shrink:0}

  /* ============ CATEGORY GRID ============ */
  .cat-grid{
    display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;width:100%;
  }
  @media(min-width:560px){.cat-grid{grid-template-columns:repeat(4,1fr);gap:10px}}
  .cat-card{
    position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;
    display:flex;align-items:flex-end;padding:10px;color:#fff;cursor:pointer;
    min-width:0;
  }
  .cat-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.1) 55%,transparent)}
  .cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cat-card span{position:relative;z-index:1;font-weight:700;font-size:.82rem;text-shadow:0 2px 8px rgba(0,0,0,.4)}

  /* ============ FEATURES ============ */
  .features{display:grid;grid-template-columns:1fr;gap:8px;width:100%}
  @media(min-width:640px){.features{grid-template-columns:repeat(3,1fr)}}
  .feature{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;display:flex;gap:10px;align-items:flex-start;min-width:0;
  }
  .feature-ico{
    flex-shrink:0;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(201,169,106,.22),rgba(138,109,59,.1));color:var(--accent);
    font-size:.9rem;
  }
  .feature > div{min-width:0}
  .feature h4{font-size:.78rem;margin-bottom:1px;font-weight:700}
  .feature p{font-size:.68rem;color:var(--ink-soft);line-height:1.4}

  /* ============ TRYON PROMO ============ */
  .tryon-promo{
    border-radius:18px;overflow:hidden;position:relative;
    background:linear-gradient(120deg,#1f1c17,#332e26 55%,#1f1c17);color:#f4efe7;
    display:grid;grid-template-columns:1fr;min-height:auto;width:100%;
  }
  @media(min-width:820px){.tryon-promo{grid-template-columns:1.15fr 1fr}}
  .tryon-promo-text{padding:20px 16px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;z-index:2;min-width:0}
  .tryon-promo-text h2{font-size:1.15rem;line-height:1.3;font-weight:800}
  .tryon-promo-text h2 em{color:var(--gold);font-style:normal}
  .tryon-promo-text p{color:#c7bfb2;font-size:.75rem;max-width:100%;line-height:1.7}
  .tryon-promo-text .btn{font-size:.75rem;padding:8px 16px;min-height:36px;align-self:flex-start}
  .tryon-promo-visual{display:none}
  @media(min-width:820px){.tryon-promo-visual{display:block;position:relative;min-height:220px;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(201,169,106,.3),transparent 62%),linear-gradient(160deg,#2b2620,#1b1814)}}

  /* ============ NEWSLETTER ============ */
  .newsletter{
    background:linear-gradient(135deg,var(--ink),#2a2620);color:var(--bg);border-radius:16px;
    padding:18px 14px;margin:18px 0;display:grid;gap:10px;text-align:center;width:100%;
  }
  @media(min-width:720px){.newsletter{grid-template-columns:1fr auto;text-align:right;align-items:center}}
  .newsletter h3{font-size:.95rem;font-weight:800;line-height:1.3}
  .newsletter p{opacity:.7;font-size:.7rem;margin-top:2px}
  .newsletter form{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:100%}
  .newsletter input{flex:1;min-width:0;padding:9px 14px;border-radius:999px;border:none;background:rgba(255,255,255,.12);color:var(--bg);font-size:.78rem;width:100%}
  .newsletter input::placeholder{color:rgba(255,255,255,.5)}
  .newsletter .btn{font-size:.75rem;padding:9px 16px;min-height:36px}

  /* ============ FOOTER ============ */
  .footer{border-top:1px solid var(--line);padding:24px 0 16px;margin-top:20px;width:100%}
  .footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
  @media(min-width:720px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr;gap:20px}}
  .footer h5{font-size:.78rem;font-weight:700;margin-bottom:8px}
  .footer a,.footer li{display:block;font-size:.72rem;color:var(--ink-soft);padding:2px 0}
  .footer ul{list-style:none}
  .footer-brand{grid-column:1 / -1}
  @media(min-width:720px){.footer-brand{grid-column:auto}}
  .footer-brand p{font-size:.72rem;color:var(--ink-soft);margin-top:6px;max-width:100%;line-height:1.6}
  .socials{display:flex;gap:6px;margin-top:8px}
  .socials a{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.62rem;font-weight:700}
  .footer-bottom{border-top:1px solid var(--line);margin-top:16px;padding-top:10px;text-align:center;font-size:.65rem;color:var(--ink-soft)}

  /* ============ SHOP ============ */
  .shop-layout{display:grid;grid-template-columns:1fr;gap:14px;padding:12px 0;width:100%}
  @media(min-width:900px){.shop-layout{grid-template-columns:220px minmax(0,1fr)}}
  .filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;height:fit-content;width:100%}
  .filters.desktop{display:none}
  @media(min-width:900px){.filters.desktop{display:block;position:sticky;top:calc(var(--header-h) + var(--safe-top) + 12px)}}
  .filter-group{border-bottom:1px solid var(--line);padding:8px 0}
  .filter-group:first-child{padding-top:0}
  .filter-group:last-child{border-bottom:none;padding-bottom:0}
  .filter-group h4{font-size:.72rem;font-weight:700;margin-bottom:6px}
  .chk{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:.74rem;color:var(--ink-soft);cursor:pointer;min-height:28px}
  .chk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
  .price-range{display:flex;gap:5px;align-items:center}
  .price-range input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:.72rem;min-width:0}
  .shop-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:10px;width:100%}
  .shop-toolbar .count{font-size:.72rem;color:var(--ink-soft);font-weight:600;flex-basis:100%;order:-1;margin-bottom:4px}
  @media(min-width:520px){.shop-toolbar .count{flex-basis:auto;margin-inline-end:auto;margin-bottom:0;order:0}}
  .shop-toolbar select{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.7rem;cursor:pointer;flex:1;min-width:0;max-width:160px}
  .filter-toggle-mobile{display:inline-flex;flex:1;max-width:100px}
  @media(min-width:900px){.filter-toggle-mobile{display:none}}
  .empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);width:100%}
  .empty-state h3{color:var(--ink);margin-bottom:4px;font-size:.92rem}
  .empty-state p{font-size:.75rem}
  .empty-state svg{width:44px;height:44px;margin:0 auto 10px;opacity:.35}

  /* ============ SHEETS ============ */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;visibility:hidden;transition:.25s}
  .overlay.open{opacity:1;visibility:visible}
  .sheet{
    position:fixed;z-index:100;background:var(--surface);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
    display:flex;flex-direction:column;box-shadow:var(--shadow-lg);width:100%;
    padding-bottom:var(--safe-bottom);
  }
  .sheet.side{
    top:0;bottom:0;right:0;width:100%;max-width:100%;
    transform:translateX(105%);
    padding-top:var(--safe-top);
  }
  @media(min-width:520px){.sheet.side{width:min(420px,90vw);max-width:100%;border-radius:20px 0 0 20px}}
  .sheet.side.open{transform:translateX(0)}
  .sheet.bottom{left:0;right:0;bottom:0;max-height:88vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
  .sheet.bottom.open{transform:translateY(0)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .sheet-head h3{font-size:.92rem;font-weight:700}
  .sheet-body{padding:12px 14px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .sheet-foot{padding:10px 14px;border-top:1px solid var(--line);flex-shrink:0}

  /* ============ CART ============ */
  .cart-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);width:100%}
  .cart-item:last-child{border-bottom:none}
  .cart-item img{width:54px;height:70px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#ece7df}
  .cart-item-info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .cart-item-info b{font-size:.76rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cart-item-info small{font-size:.64rem;color:var(--ink-soft)}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:fit-content;background:var(--bg);margin-top:3px}
  .qty button{width:24px;height:24px;display:grid;place-items:center;font-size:.9rem;color:var(--ink-soft);flex-shrink:0}
  .qty span{min-width:22px;text-align:center;font-size:.72rem;font-weight:600}
  .cart-item .price-col{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
  .cart-item .price-col b{font-size:.74rem;white-space:nowrap}
  .rm{font-size:.62rem;color:var(--danger);font-weight:600}
  .cart-summary{display:flex;flex-direction:column;gap:4px;font-size:.76rem}
  .cart-summary .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cart-summary .row span:last-child{font-weight:600;white-space:nowrap}
  .cart-summary .row.total{font-weight:800;font-size:.9rem;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}

  /* ============ PRODUCT DETAIL ============ */
  .pd-layout{display:grid;grid-template-columns:1fr;gap:14px;padding:10px 0;width:100%}
  @media(min-width:820px){.pd-layout{grid-template-columns:1fr 1fr;gap:32px}}
  .pd-gallery-main{border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4;background:#ece7df;width:100%}
  .pd-gallery-main img{width:100%;height:100%;object-fit:cover}
  .pd-thumbs{display:flex;gap:4px;margin-top:6px;overflow-x:auto;padding-bottom:2px;width:100%}
  .pd-thumbs img{width:48px;height:60px;object-fit:cover;border-radius:5px;cursor:pointer;border:2px solid transparent;flex-shrink:0;background:#ece7df}
  .pd-thumbs img.active{border-color:var(--accent)}
  .pd-info{min-width:0;width:100%}
  .pd-info h1{font-size:1.1rem;font-weight:800;line-height:1.3;margin-bottom:6px}
  .pd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .pd-price{font-size:1.15rem;font-weight:800;color:var(--accent)}
  .pd-price s{font-size:.8rem;color:var(--ink-soft);font-weight:400;margin-inline-start:4px}
  .pd-desc{color:var(--ink-soft);font-size:.78rem;margin:8px 0;line-height:1.7}
  .opt-label{font-size:.74rem;font-weight:700;margin:10px 0 5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .swatches{display:flex;gap:5px;flex-wrap:wrap}
  .swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;position:relative;flex-shrink:0}
  .swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(138,109,59,.15)}
  .swatch.active::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:.7rem;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .sizes{display:flex;gap:4px;flex-wrap:wrap}
  .size-btn{min-width:40px;padding:6px 10px;border-radius:6px;border:1.5px solid var(--line);font-size:.74rem;font-weight:600;background:var(--surface);min-height:32px}
  .size-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .size-btn:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
  .pd-actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;width:100%}
  .pd-actions .btn{flex:1;min-width:0;padding:10px 14px;font-size:.78rem;min-height:40px}
  .pd-actions #wishBtn{flex:0 0 auto;padding:10px 14px}
  .err-msg{color:var(--danger);font-size:.72rem;margin-top:6px;min-height:1em;font-weight:600}

  /* ============ STUDIO ============ */
  .studio{
    position:relative;width:100%;
    height:calc(100dvh - var(--header-h) - var(--bottom-h) - var(--safe-top) - var(--safe-bottom));
    min-height:360px;display:flex;overflow:hidden;background:var(--bg);
  }
  .studio-canvas-wrap{flex:1;position:relative;background:linear-gradient(160deg,#e9e2d6,#d4cabb);overflow:hidden;min-width:0;width:100%}
  [data-theme="dark"] .studio-canvas-wrap{background:linear-gradient(160deg,#181613,#0e0d0b)}
  .studio-canvas-wrap canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  .studio-hud{position:absolute;top:6px;left:6px;display:flex;gap:4px;z-index:5;flex-wrap:wrap}
  .studio-hud.right{left:auto;right:6px}
  .hud-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--ink);backdrop-filter:blur(8px);box-shadow:0 1px 6px rgba(0,0,0,.12);font-size:.82rem;min-width:34px}
  [data-theme="dark"] .hud-btn{background:rgba(40,36,30,.9)}
  .hud-btn.active{background:var(--ink);color:#fff}
  .studio-panel{width:320px;max-width:100%;background:var(--surface);border-inline-start:1px solid var(--line);display:none;flex-direction:column;flex-shrink:0}
  @media(min-width:900px){.studio-panel{display:flex}}
  .panel-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
  .panel-tabs button{flex:1;padding:9px 4px;font-size:.7rem;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent}
  .panel-tabs button.active{color:var(--accent);border-color:var(--accent)}
  .panel-content{flex:1;overflow-y:auto;padding:10px}
  .worn-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .worn-item{display:flex;gap:6px;align-items:center;padding:5px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
  .worn-item img{width:32px;height:42px;object-fit:cover;border-radius:4px;flex-shrink:0}
  .worn-item .wi-info{flex:1;min-width:0}
  .worn-item b{font-size:.68rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .worn-item small{font-size:.6rem;color:var(--ink-soft)}
  .worn-item button{color:var(--danger);font-size:.6rem;font-weight:600;flex-shrink:0}
  .tryon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .tryon-card{border-radius:6px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--bg);position:relative;aspect-ratio:3/4}
  .tryon-card.active{border-color:var(--accent)}
  .tryon-card img{width:100%;height:100%;object-fit:cover}
  .tryon-card span{position:absolute;bottom:0;left:0;right:0;font-size:.5rem;padding:2px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel-section{margin-bottom:10px}
  .panel-section h4{font-size:.66rem;font-weight:700;margin-bottom:5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
  .skin-swatches{display:flex;gap:5px;flex-wrap:wrap}
  .skin-sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex-shrink:0}
  .skin-sw.active{border-color:var(--accent)}
  .range-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .range-row label{font-size:.66rem;width:56px;color:var(--ink-soft);flex-shrink:0}
  .range-row input[type=range]{flex:1;accent-color:var(--accent);height:4px;min-width:0}
  .range-row output{font-size:.62rem;width:32px;text-align:left;font-weight:600;flex-shrink:0}
  .studio-mobile-toggle{display:flex}
  @media(min-width:900px){.studio-mobile-toggle{display:none}}
  .studio-mobile-panel{
    position:absolute;bottom:0;left:0;right:0;max-height:65%;z-index:20;
    background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.3);
    transform:translateY(105%);transition:transform .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;
    padding-bottom:var(--safe-bottom);
  }
  .studio-mobile-panel.open{transform:translateY(0)}
  @media(min-width:900px){.studio-mobile-panel{display:none!important}}
  .loading-overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:15;background:rgba(250,248,245,.75);backdrop-filter:blur(4px)}
  .spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .webgl-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;background:var(--bg);z-index:10}
  .zoom-controls{position:absolute;bottom:10px;left:10px;z-index:5;display:flex;flex-direction:column;gap:4px}
  .zoom-controls .hud-btn{width:34px;height:34px;font-size:1rem;font-weight:700}

  /* ============ CHECKOUT ============ */
  .co-layout{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 0;width:100%}
  @media(min-width:820px){.co-layout{grid-template-columns:1.4fr 1fr}}
  .form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;width:100%}
  .form-card h3{font-size:.82rem;margin-bottom:10px;font-weight:700}
  .field{margin-bottom:9px}
  .field label{display:block;font-size:.7rem;font-weight:600;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:.8rem;max-width:100%}
  .field .err{color:var(--danger);font-size:.62rem;margin-top:2px;display:none}
  .field.has-error .err{display:block}
  .field.has-error input,.field.has-error textarea,.field.has-error select{border-color:var(--danger)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:380px){.field-row{grid-template-columns:1fr}}
  .ship-opt{display:flex;align-items:center;gap:6px;padding:9px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:.74rem}
  .ship-opt:has(input:checked){border-color:var(--accent);background:rgba(138,109,59,.06)}
  .ship-opt input{accent-color:var(--accent);flex-shrink:0}
  .order-summary{position:static;width:100%}
  @media(min-width:820px){.order-summary{position:sticky;top:calc(var(--header-h) + var(--safe-top) + 12px)}}

  /* ============ INFO PAGES ============ */
  .info-page{max-width:840px;margin-inline:auto;padding:14px 0;width:100%}
  .info-page h1{font-size:1.15rem;font-weight:800;margin-bottom:4px}
  .info-page .lead{color:var(--ink-soft);margin-bottom:14px;font-size:.78rem}
  .prose h2{font-size:.92rem;margin:14px 0 6px;font-weight:700}
  .prose h3{font-size:.82rem;margin:10px 0 4px;font-weight:700}
  .prose p,.prose li{color:var(--ink-soft);font-size:.76rem;margin-bottom:5px;line-height:1.7}
  .prose ul{padding-inline-start:16px;margin-bottom:8px}
  .accordion{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px;background:var(--surface)}
  .accordion summary{padding:9px 12px;font-weight:600;font-size:.76rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .accordion summary::-webkit-details-marker{display:none}
  .accordion summary::after{content:"+";font-size:1rem;color:var(--accent)}
  .accordion[open] summary::after{content:"−"}
  .accordion p{padding:0 12px 10px;font-size:.72rem;color:var(--ink-soft)}

  /* ============ AUTH ============ */
  .auth-card{max-width:400px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;width:calc(100% - 24px)}
  .auth-card h2{text-align:center;margin-bottom:4px;font-size:1.05rem}
  .auth-card .sub{text-align:center;color:var(--ink-soft);font-size:.72rem;margin-bottom:14px}
  .auth-switch{text-align:center;font-size:.7rem;color:var(--ink-soft);margin-top:10px}
  .auth-switch button{color:var(--accent);font-weight:600}

  /* ============ DASHBOARD ============ */
  .dash{display:grid;grid-template-columns:1fr;gap:10px;padding:10px 0;width:100%}
  @media(min-width:900px){.dash{grid-template-columns:200px minmax(0,1fr)}}
  .dash-nav{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px;height:fit-content;display:flex;flex-direction:row;gap:3px;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch}
  @media(min-width:900px){.dash-nav{position:sticky;top:calc(var(--header-h) + var(--safe-top) + 12px);flex-direction:column;overflow:visible}}
  .dash-nav button{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:6px;font-size:.74rem;font-weight:500;color:var(--ink-soft);white-space:nowrap;flex-shrink:0}
  @media(min-width:900px){.dash-nav button{width:100%;white-space:normal}}
  .dash-nav button.active{background:var(--ink);color:var(--bg)}
  .dash-content{min-width:0;width:100%}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;width:100%}
  @media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .stat .ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(201,169,106,.22),rgba(138,109,59,.1));color:var(--accent);margin-bottom:3px;font-size:.85rem}
  .stat b{font-size:1rem;font-weight:800;line-height:1.2}
  .stat small{font-size:.62rem;color:var(--ink-soft)}
  .panel-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:10px;width:100%;overflow:hidden}
  .panel-card h3{font-size:.82rem;font-weight:700;margin-bottom:8px}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
  .data-table{width:100%;border-collapse:collapse;font-size:.7rem}
  .data-table th,.data-table td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .data-table th{font-weight:700;color:var(--ink-soft);font-size:.62rem;text-transform:uppercase;letter-spacing:.3px}
  .status-pill{padding:2px 6px;border-radius:999px;font-size:.58rem;font-weight:600;display:inline-block;white-space:nowrap}
  .status-pill.ok{background:rgba(47,125,79,.12);color:var(--ok)}
  .status-pill.warn{background:rgba(192,122,42,.12);color:var(--warn)}
  .status-pill.bad{background:rgba(178,59,59,.12);color:var(--danger)}

  /* ============ BLOG ============ */
  .blog-grid{display:grid;grid-template-columns:1fr;gap:10px;width:100%}
  @media(min-width:560px){.blog-grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:900px){.blog-grid{grid-template-columns:repeat(3,1fr)}}
  .blog-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0}
  .blog-card:active{transform:scale(.98)}
  .blog-card .bimg{aspect-ratio:16/10;overflow:hidden;background:#ece7df;width:100%}
  .blog-card .bimg img{width:100%;height:100%;object-fit:cover}
  .blog-card .bbody{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
  .blog-card h3{font-size:.8rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .blog-card p{font-size:.68rem;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .blog-card .bmeta{display:flex;gap:6px;font-size:.6rem;color:var(--ink-soft);margin-top:auto;padding-top:5px}
  .post-view{max-width:760px;margin-inline:auto;padding:12px 0;width:100%}
  .post-view h1{font-size:1.05rem;font-weight:800;line-height:1.3;margin-bottom:4px}
  .post-view .pmeta{display:flex;gap:8px;color:var(--ink-soft);font-size:.68rem;margin-bottom:10px;flex-wrap:wrap}
  .post-view .pcontent{color:var(--ink-soft);font-size:.78rem;line-height:1.8}
  .post-view .pcontent p{margin-bottom:8px}
  .post-view .pcover{border-radius:var(--radius);overflow:hidden;margin-bottom:10px;aspect-ratio:16/9;background:#ece7df;width:100%}
  .post-view .pcover img{width:100%;height:100%;object-fit:cover}

  /* ============ TOAST ============ */
  .toast-wrap{position:fixed;bottom:calc(var(--bottom-h) + var(--safe-bottom) + 8px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
  .toast{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.74rem;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .3s cubic-bezier(.16,1,.3,1);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast.ok{background:var(--ok);color:#fff}
  .toast.err{background:var(--danger);color:#fff}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}

  /* ============ MODAL ============ */
  .modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.25s}
  .modal.open{opacity:1;visibility:visible}
  .modal-box{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:16px;position:relative;-webkit-overflow-scrolling:touch}
  .modal-close{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
  .modal-box h3{font-size:.9rem;margin-bottom:10px;font-weight:700}
  table.size-table{width:100%;border-collapse:collapse;font-size:.68rem;margin-top:6px}
  table.size-table th,table.size-table td{border:1px solid var(--line);padding:5px;text-align:center}
  table.size-table th{background:var(--bg);font-weight:700}

  .breadcrumb{display:flex;gap:5px;font-size:.66rem;color:var(--ink-soft);padding:8px 0;flex-wrap:wrap;align-items:center}

  /* ============ DESKTOP OVERRIDES ============ */
  @media(min-width:900px){
    :root{--header-h:64px}
    body{padding-bottom:0;font-size:15px}
    .bottom-nav{display:none}
    .nav-desktop{display:flex;gap:2px;margin-inline-start:8px}
    .nav-desktop button{padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:500;color:var(--ink-soft)}
    .nav-desktop button.active{color:var(--ink);background:var(--line)}
    .search-wrap{display:block;position:relative}
    .search-wrap input{width:180px;padding:7px 32px 7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.8rem;transition:width .2s}
    .search-wrap input:focus{outline:none;border-color:var(--accent);width:240px}
    .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
    .mobile-search-btn{display:none}
    .logo{font-size:1.15rem}
    .logo-mark{width:34px;height:34px;font-size:1rem}
    .hero{padding:60px 0;margin-bottom:40px;border-radius:0 0 40px 40px}
    .hero h1{font-size:clamp(2rem,5vw,4rem)}
    .hero p{font-size:1.05rem;max-width:540px}
    .hero-cta .btn{font-size:.9rem;padding:11px 22px}
    .hero-orb.a{width:320px;height:320px}
    .hero-orb.b{width:250px;height:250px}
    .hero-orb.c{display:block;width:180px;height:180px;background:rgba(230,200,150,.3);top:50%;left:42%}
    .floating-card{display:block;position:absolute;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow-lg);z-index:2}
    .floating-card.fc-1{top:16%;left:7%}
    .floating-card.fc-2{bottom:20%;right:8%}
    .floating-card.fc-3{top:52%;right:14%}
    .section{padding:28px 0}
    .section-head h2{font-size:1.6rem}
    .section-head p{font-size:.85rem}
    .grid-products{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .card-body{padding:10px 12px 12px}
    .card-name{font-size:.85rem}
    .card-price b{font-size:.9rem}
    .card-cat{font-size:.62rem}
    .tryon-promo{min-height:340px}
    .tryon-promo-text{padding:32px}
    .tryon-promo-text h2{font-size:1.7rem}
    .tryon-promo-text p{font-size:.88rem}
    .tryon-promo-visual{display:block;min-height:280px}
    .footer{padding:32px 0 20px;margin-top:28px}
    .footer-grid{grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
    .footer-brand{grid-column:auto}
    .footer h5{font-size:.85rem}

function productById(id){ return ProductCatalog.find(p=>p.id===id); }
function finalPrice(p){ return p.salePrice ?? p.price; }

const CartManager = {
  save(){ Storage.set('cart', AppState.cart); updateBadges(); },
  add(p, size, colorIdx, qty=1){
    if(p.sizes.length && !size) throw new Error('لطفاً سایز را انتخاب کنید.');
    if(!size) size = p.sizes[0];
    if(!p.colors.length) colorIdx=0;
    if(colorIdx==null||colorIdx<0) throw new Error('لطفاً رنگ را انتخاب کنید.');
    const key = `${p.id}|${size}|${colorIdx}`;
    const ex = AppState.cart.find(i=>i.key===key);
    if(ex) ex.qty += qty;
    else AppState.cart.push({ key, id:p.id, name:p.name, price:finalPrice(p), size, colorIdx, qty, img:p.images[0] });
    this.save();
  },
  remove(key){ AppState.cart = AppState.cart.filter(i=>i.key!==key); this.save(); },
  setQty(key, q){ const it=AppState.cart.find(i=>i.key===key); if(it){ it.qty=Math.max(1,Math.min(99,q)); this.save(); } },
  count(){ return AppState.cart.reduce((s,i)=>s+i.qty,0); },
  subtotal(){ return AppState.cart.reduce((s,i)=>s+i.price*i.qty,0); },
  clear(){ AppState.cart=[]; this.save(); }
};

const WishlistManager = {
  save(){ Storage.set('wishlist', AppState.wishlist); updateBadges(); },
  toggle(id){ if(AppState.wishlist.includes(id)) AppState.wishlist=AppState.wishlist.filter(x=>x!==id); else AppState.wishlist.push(id); this.save(); return AppState.wishlist.includes(id); },
  has(id){ return AppState.wishlist.includes(id); }
};

const OrderManager = {
  create(order){
    order.id = 'ORD-'+Date.now().toString(36).toUpperCase();
    order.date = new Date().toISOString();
    order.status = 'در حال پردازش';
    AppState.orders.unshift(order);
    Storage.set('orders', AppState.orders);
    return order;
  },
  updateStatus(id, status){
    const o = AppState.orders.find(x=>x.id===id);
    if(o){ o.status=status; Storage.set('orders', AppState.orders); }
  }
};

const BlogManager = {
  save(){ Storage.set('posts', AppState.posts); },
  add(post){ post.id = uid(); post.date = todayISO(); AppState.posts.unshift(post); this.save(); return post; },
  remove(id){ AppState.posts = AppState.posts.filter(p=>p.id!==id); this.save(); },
  byId(id){ return AppState.posts.find(p=>p.id===id); }
};

function updateBadges(){
  const cb=$('#cartBadge'); if(cb){ cb.dataset.count=CartManager.count(); cb.textContent=CartManager.count()?fmt(CartManager.count()):''; }
  const wb=$('#wishBadge'); if(wb){ wb.dataset.count=AppState.wishlist.length; wb.textContent=AppState.wishlist.length?fmt(AppState.wishlist.length):''; }
}
function toast(msg, type=''){
  const wrap=$('#toastWrap'); if(!wrap) return;
  const t=el('div','toast '+(type||''), esc(msg));
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, 2200);
}

const Router = {
  go(page, opts={}){
    AppState.page=page;
    $$('.page').forEach(p=>p.classList.remove('active'));
    const target=$('#app');
    target.innerHTML='';
    const view = Views[page]||Views.home;
    const node = view(opts);
    node.classList.add('page','active');
    target.appendChild(node);
    window.scrollTo({top:0,behavior:'instant'});
    $$('.nav-desktop button, .bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===page));
    document.body.dataset.page=page;
    updateBadges();
  }
};

function productCard(p){
  const off = p.salePrice && p.salePrice < p.price;
  const disc = off ? Math.round((1-p.salePrice/p.price)*100) : 0;
  const card = el('article','card-product');
  card.innerHTML = `
    <div class="card-media">
      <img loading="lazy" src="${p.images[0]}" alt="${esc(p.name)}" onerror="this.style.opacity=0">
      ${p.isNew?'<span class="card-badge new">جدید</span>':''}
      ${off?`<span class="card-badge">${fmt(disc)}٪</span>`:''}
      <button class="wish-btn ${WishlistManager.has(p.id)?'active':''}" data-wish="${p.id}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="${WishlistManager.has(p.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.2C.4 8 2.3 4.3 6 4c2.2-.2 3.8 1 5 2.6C12.2 5 13.8 3.8 16 4c3.7.3 5.6 4 4 7.8-2.5 4.6-10 9.2-10 9.2Z"/></svg>
      </button>
      ${p.tryOn?'<span class="tryon-badge">◍ پرو</span>':''}
    </div>
    <div class="card-body">
      <span class="card-cat">${esc(p.category)}</span>
      <h3 class="card-name">${esc(p.name)}</h3>
      <div class="card-colors">${p.colors.map(c=>`<span class="dot" style="background:${c}"></span>`).join('')}</div>
      <div class="card-price">
        <b>${fmt(finalPrice(p))}</b>
        ${off?`<s>${fmt(p.price)}</s>`:''}
      </div>
    </div>`;
  card.addEventListener('click', e=>{
    if(e.target.closest('[data-wish]')) return;
    Router.go('product',{id:p.id});
  });
  card.querySelector('[data-wish]').addEventListener('click', e=>{
    e.stopPropagation();
    const on = WishlistManager.toggle(p.id);
    e.currentTarget.classList.toggle('active', on);
    e.currentTarget.querySelector('svg').setAttribute('fill', on?'currentColor':'none');
    toast(on?'به علاقه‌مندی‌ها اضافه شد':'حذف شد', on?'ok':'');
  });
  return card;
}

    </div>
    <div class="filter-group"><label class="chk"><input type="checkbox" id="inStockOnly" ${f.inStock?'checked':''}> فقط موجود</label></div>
    <button class="btn btn-primary btn-block btn-sm" id="applyFilters" style="margin-top:6px">اعمال</button>
  `;
  container.querySelectorAll('[data-gender]').forEach(cb=>cb.addEventListener('change',e=>{
    const g=e.target.dataset.gender;
    if(e.target.checked) f.gender.push(g); else f.gender=f.gender.filter(x=>x!==g);
    if(onChange) onChange(); else Router.go('shop');
  }));
  container.querySelectorAll('[data-cat]').forEach(cb=>cb.addEventListener('change',e=>{
    const c=e.target.dataset.cat;
    if(e.target.checked) f.cat.push(c); else f.cat=f.cat.filter(x=>x!==c);
    if(onChange) onChange(); else Router.go('shop');
  }));
  container.querySelectorAll('[data-size]').forEach(b=>{
    b.classList.toggle('active', f.sizes.includes(b.dataset.size));
    b.addEventListener('click',()=>{
      const s=b.dataset.size;
      if(f.sizes.includes(s)) f.sizes=f.sizes.filter(x=>x!==s); else f.sizes.push(s);
      if(onChange) onChange(); else Router.go('shop');
    });
  });
  container.querySelector('#applyFilters')?.addEventListener('click',()=>{
    f.min = container.querySelector('#minPrice').value ? Number(container.querySelector('#minPrice').value) : null;
    f.max = container.querySelector('#maxPrice').value ? Number(container.querySelector('#maxPrice').value) : null;
    f.inStock = container.querySelector('#inStockOnly').checked;
    if(onChange) onChange(); else Router.go('shop');
  });
}

function filterProducts(){
  const f = AppState.filters;
  let list = ProductCatalog.slice();
  if(f.gender.length) list = list.filter(p=>f.gender.includes(p.gender));
  if(f.cat.length) list = list.filter(p=>f.cat.includes(p.category));
  if(f.sizes.length) list = list.filter(p=>p.sizes.some(s=>f.sizes.includes(s)));
  if(f.min!=null) list = list.filter(p=>finalPrice(p)>=f.min);
  if(f.max!=null) list = list.filter(p=>finalPrice(p)<=f.max);
  if(f.inStock) list = list.filter(p=>p.stock>0);
  if(f.q){
    const q=f.q.trim().toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q));
  }
  switch(f.sort){
    case 'cheap': list.sort((a,b)=>finalPrice(a)-finalPrice(b)); break;
    case 'expensive': list.sort((a,b)=>finalPrice(b)-finalPrice(a)); break;
    case 'popular': list.sort((a,b)=>b.popular-a.popular); break;
    default: list.sort((a,b)=> (b.isNew?1:0)-(a.isNew?1:0) || b.popular-a.popular);
  }
  return list;
}

Views.tryon = ({id}={})=>{
  const wrap = el('div');
  wrap.style.position='relative';
  wrap.innerHTML = `
    <div class="studio" id="studio">
      <div class="studio-canvas-wrap" id="canvasWrap">
        <div class="studio-hud">

          <button class="hud-btn" id="viewBack" title="پشت">◎</button>
          <button class="hud-btn" id="viewSide" title="جانبی">◐</button>
          <button class="hud-btn" id="resetView" title="ریست">↺</button>
        </div>
        <div class="studio-hud right">
          <button class="hud-btn" id="toggleBg" title="پس‌زمینه">◑</button>
          <button class="hud-btn studio-mobile-toggle" id="openMobilePanel" title="کنترل">☰</button>
        </div>
        <div class="zoom-controls">
          <button class="hud-btn" id="zoomIn">+</button>
          <button class="hud-btn" id="zoomOut">−</button>
        </div>
        <div class="loading-overlay" id="studioLoading"><div class="spinner"></div><p style="font-size:.7rem;color:var(--ink-soft);margin-top:8px" id="loadMsg">بارگذاری…</p></div>
      </div>
      <aside class="studio-panel" id="studioPanel"></aside>
      <div class="studio-mobile-panel" id="studioMobilePanel"></div>
    </div>
  `;
  const canvasWrap = wrap.querySelector('#canvasWrap');
  const loading = wrap.querySelector('#studioLoading');
  const loadMsg = wrap.querySelector('#loadMsg');
  let studio = null;

  const init = async ()=>{
    try{
      studio = new HumanViewer(canvasWrap);
      await studio.loadWithFallback(MODEL_URLS, (msg)=>{ if(loadMsg) loadMsg.textContent = msg; });
      loading.style.display='none';
      if(AppState._pendingStyle){
        const s = AppState._pendingStyle;
        s.items.forEach(it=>{ const p = productById(it.id); if(p) studio.putOn(p, it.size, it.colorIdx); });
        AppState._pendingStyle=null;
      } else if(AppState.lastTryOn){
        const p = productById(AppState.lastTryOn);
        if(p && p.tryOn) studio.putOn(p, p.sizes[0]||'M', 0);
        AppState.lastTryOn=null;
      }
      buildStudioPanels(wrap, studio);
    }catch(e){
      console.error(e);
      loading.style.display='none';
      canvasWrap.insertAdjacentHTML('beforeend', `<div class="webgl-fallback">
        <b style="font-size:.85rem">بارگذاری مدل ناموفق</b>

      </div>`);
      bindNavButtons(wrap);
    }
  };
  setTimeout(init, 30);

  wrap.querySelector('#viewFront')?.addEventListener('click',()=>studio?.view('front'));
  wrap.querySelector('#viewBack')?.addEventListener('click',()=>studio?.view('back'));
  wrap.querySelector('#viewSide')?.addEventListener('click',()=>studio?.view('side'));
  wrap.querySelector('#resetView')?.addEventListener('click',()=>studio?.reset());
  wrap.querySelector('#toggleBg')?.addEventListener('click',()=>studio?.toggleBg());
  wrap.querySelector('#openMobilePanel')?.addEventListener('click',()=>{
    wrap.querySelector('#studioMobilePanel').classList.toggle('open');
  });
  wrap.querySelector('#zoomIn')?.addEventListener('click',()=>studio?.zoom(0.8));
  wrap.querySelector('#zoomOut')?.addEventListener('click',()=>studio?.zoom(1.25));
  return wrap;
};

function buildStudioPanels(root, studio){
  const panel = root.querySelector('#studioPanel');
  const mob = root.querySelector('#studioMobilePanel');
  const render = (target)=>{
    target.innerHTML = `
      <div class="panel-tabs">
        <button class="active" data-tab="wardrobe">لباس</button>
        <button data-tab="body">بدن</button>
        <button data-tab="skin">ظاهر</button>
      </div>
      <div class="panel-content" id="panelContent"></div>
    `;
    const content = target.querySelector('#panelContent');
    target.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
      target.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderTab(b.dataset.tab, content, studio);
    }));
    renderTab('wardrobe', content, studio);
  };
  render(panel);
  if(mob) render(mob);
}
function renderTab(tab, content, studio){
  if(tab==='wardrobe') renderWardrobeTab(content, studio);
  else if(tab==='body') renderBodyTab(content, studio);
  else renderSkinTab(content, studio);
}

function renderWardrobeTab(content, studio){

      </div>

      <h4>انتخاب</h4>

        ${tryonProducts.map(p=>`
          <div class="tryon-card ${worn.some(w=>w.id===p.id)?'active':''}" data-product="${p.id}">
            <img src="${p.images[0]}" alt="${esc(p.name)}" loading="lazy"><span>${esc(p.name)}</span>

    </div>
  `;
  content.querySelectorAll('#wornList [data-remove]').forEach(b=>b.addEventListener('click',()=>{
    studio.removeWorn(b.dataset.remove);
    renderWardrobeTab(content, studio);
    syncOtherPanel(content, 'wardrobe', studio);
  }));
  content.querySelector('#clearWorn').addEventListener('click',()=>{
    studio.clearWorn(); renderWardrobeTab(content, studio); syncOtherPanel(content, 'wardrobe', studio);
  });
  content.querySelector('#saveStyle').addEventListener('click',()=>{
    if(!studio.getWorn().length){ toast('خالی است','err'); return; }

    toast('ذخیره شد ✓','ok');
  });
  content.querySelectorAll('[data-product]').forEach(card=>card.addEventListener('click',()=>{
    const p = productById(card.dataset.product);
    if(!p) return;
    studio.putOn(p, p.sizes[0]||'M', 0);
    renderWardrobeTab(content, studio);
    syncOtherPanel(content, 'wardrobe', studio);

function syncOtherPanel(currentContent, tab, studio){

}

      foot.querySelector('#goCheckout').addEventListener('click',()=>{ close(); Router.go('checkout'); });
      foot.querySelector('#keepShopping').addEventListener('click',()=>{ close(); Router.go('shop'); });
    }
    body.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
      const it = AppState.cart.find(i=>i.key===b.dataset.key);
      if(it){ CartManager.setQty(it.key, it.qty+Number(b.dataset.q)); render(); }
    }));
    body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ CartManager.remove(b.dataset.rm); render(); }));
  };
  render();
  const close = ()=>{ sheet.classList.remove('open'); $('#overlay').classList.remove('open'); setTimeout(()=>sheet.remove(),320); };
  sheet.querySelector('[data-close]').addEventListener('click',close);
  $('#overlay').onclick = close;
}

      if(!ok) valid=false;

    const fd = new FormData(form);

    CartManager.clear();
    showOrderConfirm(wrap, saved.total, saved.id);
  });
  bindNavButtons(wrap);
  return wrap;
};

    }
  };
  renderTab(tab);

class HumanViewer{
  constructor(container){
    this.container = container;
    this.worn = [];
    this.settings = { heightScale:1.0, size:'M', gender:'women' };
    this.skinIdx = 1;
    this.hairIdx = 1;
    this.bgIdx = 0;
    this.autoRotate = false;
    this._ready = false;
    this._initScene();
  }

  _initScene(){
    const w = this.container.clientWidth || 300;
    const h = this.container.clientHeight || 400;

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xe8e1d5);

    this.camera = new THREE.PerspectiveCamera(28, w/h, 0.05, 500);
    this.camera.position.set(0, 1.0, 6.0);
    this.baseCameraPos = new THREE.Vector3(0, 1.0, 6.0);
    this.baseTarget = new THREE.Vector3(0, 0.95, 0);

    this.renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(w,h);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.05;
    this.container.appendChild(this.renderer.domElement);

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.06;
    this.controls.target.set(0, 0.95, 0);
    this.controls.minDistance = 0.3;
    this.controls.maxDistance = 30.0;
    this.controls.maxPolarAngle = Math.PI * 0.95;
    this.controls.minPolarAngle = 0.02;
    this.controls.enableZoom = true;
    this.controls.zoomSpeed = 1.5;
    this.controls.enablePan = false;
    this.controls.update();

    this.scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a7a62, 1.1));

    const key = new THREE.DirectionalLight(0xfff2dd, 2.0);
    key.position.set(2.0, 3.5, 2.5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024,1024);
    key.shadow.camera.left=-2; key.shadow.camera.right=2;
    key.shadow.camera.top=3; key.shadow.camera.bottom=-1;
    key.shadow.bias = -0.0005;
    this.scene.add(key);

    const fill = new THREE.DirectionalLight(0xcfd8ff, 0.55);
    fill.position.set(-2.5, 2.0, 1.2);
    this.scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffe0b0, 0.7);
    rim.position.set(-1.0, 2.5, -2.5);
    this.scene.add(rim);

    const floorGeo = new THREE.CircleGeometry(3.5, 64);
    const floorMat = new THREE.MeshStandardMaterial({color:0xd8cfc1, roughness:0.95, metalness:0});
    this.floor = new THREE.Mesh(floorGeo, floorMat);
    this.floor.rotation.x = -Math.PI/2;
    this.floor.position.y = 0.001;
    this.floor.receiveShadow = true;
    this.scene.add(this.floor);

    this._animate = this._animate.bind(this);
    this._animate();

    this._onResize = debounce(()=>this._resize(), 150);
    window.addEventListener('resize', this._onResize);
  }

  loadWithFallback(urls, onProgress){
    return new Promise((resolve, reject)=>{
      const loader = new GLTFLoader();
      let idx = 0;
      const attempt = ()=>{
        if(idx >= urls.length){
          reject(new Error('All URLs failed.'));
          return;
        }
        const url = urls[idx++];
        if(onProgress) onProgress(`تلاش ${idx}/${urls.length}…`);
        loader.load(
          url,
          (gltf)=>{
            try{
              this.model = gltf.scene;
              this.model.position.y = 0;
              this.model.traverse(obj=>{
                if(obj.isMesh){
                  obj.castShadow = true;
                  obj.receiveShadow = true;
                  if(obj.material) obj.material.envMapIntensity = 1.0;
                }
              });
              const box = new THREE.Box3().setFromObject(this.model);
              const size = box.getSize(new THREE.Vector3());
              if(size.y > 0){
                const s = 1.75 / size.y;
                this.model.scale.setScalar(s);
              }
              box.setFromObject(this.model);
              const center = box.getCenter(new THREE.Vector3());
              this.model.position.x = -center.x;
              this.model.position.z = -center.z;
              this.model.position.y = -box.min.y;
              this.scene.add(this.model);

              this.skinMaterials = [];
              this.hairMaterials = [];
              this.model.traverse(obj=>{
                if(obj.isMesh && obj.material){
                  const name = (obj.material.name||'').toLowerCase();
                  const meshName = (obj.name||'').toLowerCase();
                  if(name.includes('skin') || meshName.includes('body') || meshName.includes('head')){
                    this.skinMaterials.push(obj.material);
                  }
                  if(name.includes('hair') || meshName.includes('hair')){
                    this.hairMaterials.push(obj.material);
                  }
                }
              });
              this._applySkinColor();
              this._applyHairColor();
              this._fitCameraToModel();
              this._ready = true;
              if(onProgress) onProgress('بارگذاری شد');
              resolve();
            }catch(err){ reject(err); }
          },
          (xhr)=>{
            if(onProgress && xhr.total){
              const pct = Math.round(xhr.loaded/xhr.total*100);
              onProgress(`بارگذاری ${pct}%`);
            }
          },
          (err)=>{
            console.warn(`Failed ${url}:`, err);
            attempt();
          }
        );
      };
      attempt();
    });
  }

  _fitCameraToModel(){
    if(!this.model) return;
    const box = new THREE.Box3().setFromObject(this.model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const height = size.y || 1.75;
    this.controls.target.set(0, center.y, 0);
    const dist = height * 4.0;
    this.camera.position.set(0, center.y, dist);
    this.camera.lookAt(this.controls.target);
    this.baseCameraPos = this.camera.position.clone();
    this.baseTarget = this.controls.target.clone();
    this.controls.minDistance = Math.max(0.3, dist * 0.3);
    this.controls.maxDistance = dist * 2.5;
    this.controls.update();
  }

  _animate(){
    requestAnimationFrame(this._animate);
    if(this.autoRotate && this.model) this.model.rotation.y += 0.005;
    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  _resize(){
    const w = this.container.clientWidth, h = this.container.clientHeight;
    if(!w||!h) return;
    this.camera.aspect = w/h; this.camera.updateProjectionMatrix();
    this.renderer.setSize(w,h);
  }

  _applySkinColor(){
    const colors = [0xf3d7c1,0xe6bfa5,0xd1a17a,0xb47b52,0x8d5a3a,0x5d3a26];
    const col = new THREE.Color(colors[this.skinIdx] ?? colors[0]);
    this.skinMaterials?.forEach(m=>{ if(m.color) m.color.copy(col); });
  }
  _applyHairColor(){
    const colors = [0x1c1a17,0x3a2a1e,0x6b4b2f,0xb08a5c,0xe8d3a8];
    const col = new THREE.Color(colors[this.hairIdx] ?? colors[0]);
    this.hairMaterials?.forEach(m=>{ if(m.color) m.color.copy(col); });
  }

  putOn(product, size='M', colorIdx=0){
    const key = product.id + '|' + size + '|' + colorIdx;
    const sameCat = this.worn.filter(w=>{
      const p = productById(w.id);
      return p && p.category === product.category;
    });
    sameCat.forEach(w=>this.removeWorn(w.key));
    this.worn.push({key, id:product.id, size, colorIdx, category:product.category});
    this._applyClothes();
  }
  removeWorn(key){ this.worn = this.worn.filter(w=>w.key!==key); this._applyClothes(); }
  clearWorn(){ this.worn=[]; this._applyClothes(); }
  getWorn(){ return this.worn.slice(); }

  _applyClothes(){
    if(!this.model) return;
    if(this.clothesGroup){
      this.model.remove(this.clothesGroup);
      this.clothesGroup.traverse(n=>{ if(n.geometry) n.geometry.dispose?.(); if(n.material && !n.material.__shared) n.material.dispose?.(); });
    }
    this.clothesGroup = new THREE.Group();
    this.model.add(this.clothesGroup);

    const box = new THREE.Box3().setFromObject(this.model);
    const height = box.max.y - box.min.y;
    const feetY = box.min.y;
    const headY = box.max.y;
    const bodyWidth = box.max.x - box.min.x;
    const bodyDepth = box.max.z - box.min.z;
    const bodyCenterX = (box.max.x + box.min.x) / 2;
    const bodyCenterZ = (box.max.z + box.min.z) / 2;

    const shoulderY = headY - height * 0.16;
    const waistY = headY - height * 0.40;
    const hipY = headY - height * 0.50;
    const kneeY = feetY + height * 0.28;
    const ankleY = feetY + height * 0.05;

    const bodyR = Math.max(bodyWidth, bodyDepth) * 0.5;
    const wrapR = bodyR * 0.85;

    this.worn.forEach(w=>{
      const p = productById(w.id);
      if(!p) return;
      const col = p.colors[w.colorIdx||0] || '#888';
      const mat = new THREE.MeshStandardMaterial({
        color:new THREE.Color(col), roughness:.75, metalness:.02, side:THREE.DoubleSide
      });
      mat.__shared = false;

      const cat = p.category;
      const isTop = ['تی‌شرت و پولوشرت','پیراهن','بلوز و شومیز','تی‌شرت','کت و بلیزر','کت و مانتو','لباس رسمی'].includes(cat);
      const isBottom = ['شلوار','جین','شلوار و جین','دامن'].includes(cat);
      const isDress = ['پیراهن و لباس مجلسی'].includes(cat);
      const isShoe = ['کفش'].includes(cat);
      const isAcc = ['اکسسوری','کیف و اکسسوری'].includes(cat);

      if(isTop || isDress){
        const topY = shoulderY + height * 0.02;
        const bottomY = isDress ? (kneeY + height * 0.05) : (waistY + height * 0.02);
        const topHeight = topY - bottomY;
        const geo = new THREE.CylinderGeometry(wrapR * 1.02, wrapR * 0.85, topHeight, 32, 1, true);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(bodyCenterX, (topY + bottomY) / 2, bodyCenterZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.clothesGroup.add(mesh);
        if(!isDress && isTop){
          const sleeveLen = height * 0.10;
          for(const s of [-1,1]){
            const sleeveGeo = new THREE.CylinderGeometry(wrapR * 0.32, wrapR * 0.28, sleeveLen, 16, 1, true);
            const sm = new THREE.Mesh(sleeveGeo, mat);
            sm.position.set(bodyCenterX + s * (wrapR * 1.05), topY - sleeveLen * 0.5, bodyCenterZ);
            sm.rotation.z = s * 0.15;
            sm.castShadow = true;
            this.clothesGroup.add(sm);
          }
        }
      }
      if(isBottom && !isDress){
        const topY = hipY + height * 0.02;
        const bottomY = cat === 'دامن' ? (kneeY + height * 0.02) : (ankleY + height * 0.02);
        const botHeight = topY - bottomY;
        const geo = new THREE.CylinderGeometry(wrapR * 0.95, wrapR * (cat === 'دامن' ? 1.3 : 0.75), botHeight, 28, 1, true);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(bodyCenterX, (topY + bottomY) / 2, bodyCenterZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        this.clothesGroup.add(mesh);
        if(cat !== 'دامن'){
          const legTop = hipY;
          const legBottom = ankleY;
          const legHeight = legTop - legBottom;
          const legOffset = wrapR * 0.45;
          for(const s of [-1,1]){
            const legGeo = new THREE.CylinderGeometry(wrapR * 0.38, wrapR * 0.20, legHeight, 16, 1, true);
            const lm = new THREE.Mesh(legGeo, mat);
            lm.position.set(bodyCenterX + s * legOffset, (legTop + legBottom) / 2, bodyCenterZ);
            lm.castShadow = true;
            this.clothesGroup.add(lm);
          }
        }
      }
      if(isShoe){
        for(const s of [-1,1]){
          const shoeGeo = new THREE.BoxGeometry(wrapR * 0.42, height * 0.035, wrapR * 0.85);
          const sm = new THREE.Mesh(shoeGeo, mat);
          sm.position.set(bodyCenterX + s * (wrapR * 0.42), feetY + height * 0.02, bodyCenterZ + wrapR * 0.2);
          sm.castShadow = true;
          this.clothesGroup.add(sm);
        }
      }
      if(isAcc){
        const ringGeo = new THREE.TorusGeometry(wrapR * 0.55, height * 0.005, 8, 32);
        const rm = new THREE.Mesh(ringGeo, mat);
        rm.position.set(bodyCenterX, shoulderY - height * 0.03, bodyCenterZ + bodyDepth * 0.05);
        rm.rotation.x = Math.PI / 2;
        this.clothesGroup.add(rm);
      }
    });
  }

  setSkin(idx){ this.skinIdx = idx; this._applySkinColor(); }
  getSkin(){ return this.skinIdx; }
  setHair(idx){ this.hairIdx = idx; this._applyHairColor(); }
  getHair(){ return this.hairIdx; }
  setBody(key, val){
    if(key==='heightScale'){
      this.settings.heightScale = val;
      if(this.model){
        if(!this._baseScale) this._baseScale = this.model.scale.x;
        this.model.scale.setScalar(this._baseScale * val);
      }
      return;
    }
    this.settings[key] = val;
  }
  getBodySettings(){ return {...this.settings}; }

  view(dir){
    if(!this.model) return;
    const box = new THREE.Box3().setFromObject(this.model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const height = size.y || 1.75;
    const dist = height * 4.0;
    this.controls.target.set(0, center.y, 0);
    if(dir==='front') this.camera.position.set(0, center.y, dist);
    if(dir==='back') this.camera.position.set(0, center.y, -dist);
    if(dir==='side') this.camera.position.set(dist, center.y, 0);
    this.camera.lookAt(this.controls.target);
    this.controls.update();
  }
  reset(){
    if(this.baseTarget){
      this.camera.position.copy(this.baseCameraPos);
      this.controls.target.copy(this.baseTarget);
    } else {
      this.camera.position.set(0, 1.0, 6.0);
      this.controls.target.set(0, 0.95, 0);
    }
    this.controls.update();
  }
  zoom(factor){
    const dir = new THREE.Vector3().subVectors(this.camera.position, this.controls.target);
    const dist = dir.length();
    const newDist = Math.max(this.controls.minDistance, Math.min(this.controls.maxDistance, dist * factor));
    dir.setLength(newDist);
    this.camera.position.copy(this.controls.target).add(dir);
    this.controls.update();
  }
  toggleAutoRotate(){ this.autoRotate = !this.autoRotate; return this.autoRotate; }
  toggleBg(){
    const bgs = [0xe8e1d5, 0x181512, 0x25201a, 0x2b3440];
    this.bgIdx = (this.bgIdx+1) % bgs.length;
    this.scene.background = new THREE.Color(bgs[this.bgIdx]);
    if(this.floor) this.floor.material.color.setHex(this.bgIdx===0?0xd8cfc1:0x2a2520);
  }
}

function boot(){
  document.documentElement.dataset.theme = AppState.theme;
  updateBadges();

  $$('[data-nav]').forEach(n=>{
    if(n.closest('#app')) return;
    n.addEventListener('click',e=>{
      e.preventDefault();
      const t=n.dataset.nav;
      if(t==='tryon') Router.go('tryon');
      else if(t==='men'||t==='women'){ AppState.filters.cat=[]; Router.go(t); }
      else Router.go(t);
    });
  });

  $('#cartBtn').addEventListener('click', openCartSheet);
  $('#wishlistBtn')?.addEventListener('click',()=>Router.go('wishlist'));

  $('#themeToggle').addEventListener('click',()=>{
    AppState.theme = AppState.theme==='light'?'dark':'light';
    Storage.set('theme', AppState.theme);
    document.documentElement.dataset.theme = AppState.theme;
  });

  const searchInput = $('#headerSearch');
  searchInput?.addEventListener('input', debounce(e=>{
    AppState.filters.q = e.target.value;
    if(AppState.page!=='shop') Router.go('shop');
    else {
      const grid = $('#shopGrid');
      if(grid){
        const list = filterProducts();
        grid.innerHTML='';
        list.forEach(p=>grid.appendChild(productCard(p)));
        const c = $('#shopGrid')?.closest('.shop-layout')?.querySelector('.count');
        if(c) c.textContent = fmt(list.length)+' نتیجه';
      }
    }
  }, 250));

  $('#mobileSearchBtn')?.addEventListener('click',()=>{
    const sheet = el('div','sheet bottom');
    sheet.innerHTML = `<div class="sheet-head"><h3>جست‌وجو</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="sheet-body"><input type="search" id="mobileSearchInput" placeholder="نام محصول…" style="width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:16px" autofocus></div>`;
    document.body.appendChild(sheet);
    requestAnimationFrame(()=>{ sheet.classList.add('open'); $('#overlay').classList.add('open'); });
    const close=()=>{ sheet.classList.remove('open'); $('#overlay').classList.remove('open'); setTimeout(()=>sheet.remove(),320); };
    sheet.querySelector('[data-close]').addEventListener('click',close);
    $('#overlay').onclick = close;
    const input = sheet.querySelector('#mobileSearchInput');
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ AppState.filters.q = input.value; close(); Router.go('shop'); }
    });
  });

  Router.go('home');
}

document.addEventListener('DOMContentLoaded', boot);
window.VESTORA = { AppState, ProductCatalog, CartManager, WishlistManager, OrderManager, BlogManager, Router, HumanViewer };
</script>
